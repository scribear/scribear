services:
  # Reverse Proxy
  nginx:
    image: ${IMAGE_REGISTRY:-ghcr.io/scribear}/scribear-nginx:${IMAGE_TAG:-latest}
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ${SSL_CERT_PATH}:/etc/nginx/ssl/pub.cert:ro
      - ${SSL_KEY_PATH}:/etc/nginx/ssl/priv.key:ro
    depends_on:
      client-webapp:
        condition: service_healthy
      standalone-webapp:
        condition: service_healthy
      kiosk-webapp:
        condition: service_healthy
      node-server:
        condition: service_healthy
      session-manager:
        condition: service_healthy
      admin-webapp:
        condition: service_healthy
      admin-server:
        condition: service_healthy
    networks:
      - frontend
      - backend
    restart: unless-stopped

  # Frontend Webapps
  client-webapp:
    image: ${IMAGE_REGISTRY:-ghcr.io/scribear}/client-webapp:${IMAGE_TAG:-latest}
    expose:
      - "80"
    networks:
      - frontend
    restart: unless-stopped

  standalone-webapp:
    image: ${IMAGE_REGISTRY:-ghcr.io/scribear}/standalone-webapp:${IMAGE_TAG:-latest}
    expose:
      - "80"
    networks:
      - frontend
    restart: unless-stopped

  kiosk-webapp:
    image: ${IMAGE_REGISTRY:-ghcr.io/scribear}/kiosk-webapp:${IMAGE_TAG:-latest}
    expose:
      - "80"
    networks:
      - frontend
    restart: unless-stopped

  admin-webapp:
    image: ${IMAGE_REGISTRY:-ghcr.io/scribear}/admin-webapp:${IMAGE_TAG:-latest}
    expose:
      - "80"
    networks:
      - frontend
    restart: unless-stopped

  # Backend APIs
  session-manager:
    image: ${IMAGE_REGISTRY:-ghcr.io/scribear}/session-manager:${IMAGE_TAG:-latest}
    expose:
      - "80"
    environment:
      LOG_LEVEL: ${SESSION_MANAGER_LOG_LEVEL:-info}
      ADMIN_API_KEY: ${SESSION_MANAGER_API_KEY}
      SESSION_MANAGER_SERVICE_API_KEY: ${NODE_SERVER_KEY}
      SESSION_TOKEN_SIGNING_KEY: ${JWT_SECRET}
      # Device presence (B1.6). The TTL must comfortably exceed the schedule
      # long-poll cycle plus the write interval, or a healthy device flips
      # offline between two writes.
      DEVICE_LAST_SEEN_WRITE_INTERVAL_SEC: ${DEVICE_LAST_SEEN_WRITE_SEC:-60}
      DEVICE_ONLINE_TTL_SEC: ${DEVICE_ONLINE_TTL_SEC:-180}
      # Defaulted to the bundled container. Point them at a managed Postgres
      # to run the database outside this stack - see deployment/UPGRADING.md,
      # which also covers removing the bundled service and its depends_on.
      DB_HOST: ${DB_HOST:-scribear-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # Demo caption room. Seeds a joinable demo session whose uid the Node
      # Server publishes a looping fixture caption stream into - see
      # apps/session-manager/.env.example. On by default; set
      # DEMO_ROOM_ENABLED=false in the deployment .env to turn it off. The
      # session uid uses a built-in default shared with the Node Server, so it
      # does not need to be passed here.
      DEMO_ROOM_ENABLED: ${DEMO_ROOM_ENABLED:-true}
    depends_on:
      scribear-db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - backend
    restart: unless-stopped

  # Database migrations, as a one-shot job rather than a script on the host.
  #
  # Same image and tag as session-manager, running its second entry point
  # (apps/session-manager/src/migrate.ts). That is the whole design: the service
  # that owns this schema applies it, from the artifact the deployment is
  # actually pinned to, so the schema and the code querying it can never
  # disagree. It replaces run-migrator.sh's `git clone` of `staging` into a
  # throwaway container, which applied whatever that branch happened to hold -
  # and only on a database with no tables at all, so every upgrade after the
  # first silently migrated nothing.
  #
  # `service_completed_successfully` above and on admin-server makes it
  # fail-closed and correctly ordered: migrations finish before anything queries
  # the schema, and a migration that fails means those services never start,
  # with the reason in `docker compose logs db-migrate` rather than spread across
  # two crash loops. It is idempotent - `docker compose up -d` re-runs it every
  # time and it exits in a second when there is nothing pending.
  #
  # Only the DB_* variables, deliberately: the job needs no other secret, so it
  # still works in a deployment that has not set them.
  db-migrate:
    image: ${IMAGE_REGISTRY:-ghcr.io/scribear}/session-manager:${IMAGE_TAG:-latest}
    command: ["node", "dist/migrate.mjs"]
    environment:
      DB_HOST: ${DB_HOST:-scribear-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      scribear-db:
        condition: service_healthy
    networks:
      - backend
    # A job, not a service: it must run to completion once, and a restart policy
    # would fight `service_completed_successfully`.
    restart: "no"
    # The image's own healthcheck wgets session-manager's liveness route on port
    # 80, which this container never listens on, so without this it would sit
    # permanently "unhealthy" in `docker compose ps` after a successful run.
    healthcheck:
      disable: true

  admin-server:
    image: ${IMAGE_REGISTRY:-ghcr.io/scribear}/admin-server:${IMAGE_TAG:-latest}
    expose:
      - "80"
    environment:
      # The identity of *this file*, so the admin console can notice that new
      # images are running against an old compose file. Nothing else in the
      # stack can see that: this file is not part of any image, so an operator
      # who pulls new images without copying it gets missing services, missing
      # variables and changed wiring, silently. admin-server compares this
      # against the value baked into its own image and reports the result on
      # the Deployment Check page.
      #
      # A literal, deliberately, and never `${COMPOSE_FILE_VERSION:-}`: a
      # carried-over .env is exactly the thing that goes stale, so letting it
      # supply this value would let the stale half of a deployment vouch for
      # the other half. Nothing about it belongs in .env.
      #
      # Bump it when a change to this file is one an operator must redeploy
      # for - a new service, a new or renamed variable, changed wiring - and
      # bump `EXPECTED_COMPOSE_FILE_VERSION` in admin-server to match. A unit
      # test fails if the two ever disagree, or if this file changes without
      # someone deciding which of the two cases they are in.
      #
      # Not `:?`-guarded, like DEPLOYMENT_ENV below and unlike the secrets: it
      # changes what is *reported*, never what runs, and must not be able to
      # stop a stack from starting.
      COMPOSE_FILE_VERSION: "4"
      LOG_LEVEL: ${ADMIN_LOG_LEVEL:-info}
      ADMIN_API_KEY: ${SESSION_MANAGER_API_KEY}
      SESSION_MANAGER_BASE_URL: http://session-manager:80
      # Which standard the admin console's Config Check judges this deployment
      # against. Not `:?`-guarded, unlike the secrets below: it changes how
      # findings are *reported*, never how anything behaves, so it must not be
      # able to stop a stack from starting. Unset infers production, which is
      # the strict direction - a deployment that predates this variable gets
      # judged strictly rather than reassured.
      DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-}
      # Health rollup (B1.5). Only the unauthenticated readiness probes of
      # these services are read; no keys are involved.
      NODE_SERVER_BASE_URL: http://node-server:80
      TRANSCRIPTION_SERVICE_BASE_URL: http://transcription-service:80
      HEALTH_CHECK_TIMEOUT_SEC: ${ADMIN_HEALTH_TIMEOUT_SEC:-3}
      # Fleet telemetry (B1.7 §2.5). Empty disables GET /api/admin/v1/fleet
      # (503 TELEMETRY_UNAVAILABLE) without affecting the /health rollup
      # above, which is a separate, always-on data path.
      REDIS_URL: ${ADMIN_REDIS_URL:-}
      # Operator test-audio devices (PLAN-TestAudioDevices §3). Defaulted to the
      # in-stack generator, which now starts with everything else, so the panel
      # is wired with no .env entry at all. Point it elsewhere, or blank it, to
      # turn the feature off: empty makes GET /api/admin/v1/test-audio answer
      # {available: false, devices: []} at 200 and every mutation answer 503
      # TEST_AUDIO_UNAVAILABLE - a disabled panel rather than an error to rule
      # out.
      #
      # Only the key needs setting, and it must match the generator's own
      # TEST_AUDIO_SERVICE_KEY below. It is injected server-side by admin-server
      # and never reaches the browser. Until it is set the generator will not
      # start, and this console reports the devices as unreachable.
      TEST_AUDIO_BASE_URL: ${TEST_AUDIO_BASE_URL:-http://test-audio-generator:80}
      TEST_AUDIO_SERVICE_KEY: ${TEST_AUDIO_SERVICE_KEY:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}
      ADMIN_LOCAL_CREDENTIALS: ${ADMIN_LOCAL_CREDENTIALS}
      # Defaulted to the bundled container. Point them at a managed Postgres
      # to run the database outside this stack - see deployment/UPGRADING.md,
      # which also covers removing the bundled service and its depends_on.
      DB_HOST: ${DB_HOST:-scribear-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      session-manager:
        condition: service_healthy
      scribear-db:
        condition: service_healthy
      # admin-server migrates its own audit-log tables on startup, but its
      # Config Check reads the shared schema's migration state, so it should not
      # start before the migrator has had its say.
      db-migrate:
        condition: service_completed_successfully
    networks:
      - frontend
      - backend
    restart: unless-stopped

  node-server:
    image: ${IMAGE_REGISTRY:-ghcr.io/scribear}/node-server:${IMAGE_TAG:-latest}
    expose:
      - "80"
    environment:
      LOG_LEVEL: ${NODE_SERVER_LOG_LEVEL:-info}
      # `:?` deliberately: this is a new required secret as of B1.1, so an .env
      # carried over from before it would otherwise substitute a blank string
      # here, and a blank inbound key authenticates any caller that sends
      # `Authorization: Bearer `. Failing interpolation stops the whole stack
      # before a single container starts.
      NODE_SERVER_SERVICE_API_KEY: ${NODE_SERVER_SERVICE_KEY:?NODE_SERVER_SERVICE_KEY is unset. Your .env predates the monitoring/fleet release - read deployment/UPGRADING.md (or the wiki Deployment page) and add the new keys before starting.}
      SESSION_TOKEN_SIGNING_KEY: ${JWT_SECRET}
      SESSION_MANAGER_BASE_URL: http://session-manager:80
      SESSION_MANAGER_SERVICE_API_KEY: ${NODE_SERVER_KEY}
      TRANSCRIPTION_SERVICE_BASE_URL: http://transcription-service:80
      TRANSCRIPTION_SERVICE_API_KEY: ${TRANSCRIPTION_API_KEY}
      # Fleet telemetry publishing (B1.7). Empty switches it off, which is the
      # default in .env.example: publishing is what puts this instance's rooms
      # in the dashboard, and nothing else depends on it. `NODE_INSTANCE_ID` is
      # left unset deliberately - it defaults to the hostname, which compose
      # sets to the container name, so scaling this service gives each replica
      # a distinct identity with no further configuration.
      REDIS_URL: ${NODE_SERVER_REDIS_URL:-}
      # Demo caption room. When enabled, this Node Server auto-emits a looping
      # fixture caption stream for the demo session - see
      # apps/node-server/.env.example. On by default; set DEMO_ROOM_ENABLED=false
      # in the deployment .env to turn it off. The session uid uses a built-in
      # default shared with the session-manager service above, so it does not
      # need to be passed here.
      DEMO_ROOM_ENABLED: ${DEMO_ROOM_ENABLED:-true}
    depends_on:
      transcription-service:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  # Infrastructure
  scribear-db:
    image: ${IMAGE_REGISTRY:-ghcr.io/scribear}/scribear-db:${IMAGE_TAG:-latest}
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    # Loopback only. Every service in the stack reaches Postgres over the
    # `backend` network by hostname, and run-migrator.sh runs inside a
    # container on that same network, so nothing needs this published at all -
    # it is here for `psql` from the host. Bound to 127.0.0.1 because
    # `"5432:5432"` binds every interface the host has, which on a public box
    # means Postgres is exposed to the internet behind nothing but DB_PASSWORD.
    #
    # Note that a host firewall is NOT a substitute: Docker's DNAT rules are
    # traversed before ufw's INPUT chain, so `ufw deny 5432` looks applied and
    # leaves the port reachable. Filtering a published port means the
    # DOCKER-USER chain. Binding the interface avoids the whole question.
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Telemetry backplane for the fleet dashboard (B1.7).
  #
  # Every publisher and reader is gated on its own REDIS_URL, all of which are
  # unset by default, so today this container runs and nothing talks to it. It
  # is here ahead of them because the alternative - introducing shared
  # infrastructure in the same change that starts depending on it - makes a
  # telemetry bug and a deployment bug look identical.
  #
  # Nothing in the transcription path touches it. Losing Redis costs the
  # dashboard its cross-instance view and costs sessions nothing.
  #
  # No persistence, deliberately: every key is a snapshot its publisher
  # rewrites within seconds under a TTL of the same order, so a restart
  # repopulates faster than an operator can notice, while an RDB or AOF would
  # only restore state that is stale by construction - and would restore rooms
  # that no longer exist.
  redis:
    image: ${IMAGE_REGISTRY:-ghcr.io/scribear}/scribear-redis:${IMAGE_TAG:-latest}
    # `:?` deliberately, and on the `--requirepass` argument rather than only
    # on the environment below: `redis-server --requirepass ""` is not a
    # password-protected server that rejects logins, it is an *open* server
    # that accepts every unauthenticated command. An .env carried over from
    # before this release has no REDIS_PASSWORD at all, so without this guard
    # the upgrade would silently stand up an unauthenticated Redis holding the
    # whole fleet's operational state.
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD:?REDIS_PASSWORD is unset. Your .env predates the monitoring/fleet release - read deployment/UPGRADING.md (or the wiki Deployment page) and add the new keys before starting.}",
        "--save",
        "",
        "--appendonly",
        "no",
      ]
    environment:
      # Read by the image's healthcheck, which authenticates before PINGing.
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is unset. Your .env predates the monitoring/fleet release - read deployment/UPGRADING.md (or the wiki Deployment page) and add the new keys before starting.}
    # Not published to the host, unlike scribear-db: nothing outside the
    # backend network has any reason to reach it, and its contents are the
    # whole fleet's operational state.
    expose:
      - "6379"
    networks:
      - backend
    restart: unless-stopped

  transcription-service:
    image: ${IMAGE_REGISTRY:-ghcr.io/scribear}/transcription-service-${TRANSCRIPTION_DEVICE:-cpu}:${IMAGE_TAG:-latest}
    # No GPU reservation here, on purpose. It lives in `compose.gpu.yml`, which a
    # CUDA deployment overlays:
    #
    #   docker compose -f compose.yml -f compose.gpu.yml up -d
    #
    # This file used to reserve `driver: nvidia` unconditionally, which had
    # nothing to do with `TRANSCRIPTION_DEVICE` - so the *default* configuration
    # (`cpu`) demanded a GPU, and on any host without the NVIDIA runtime the
    # container was created and then refused to start with `could not select
    # device driver "nvidia"`, taking node-server down with it. A CPU-only host,
    # or an Apple Silicon Mac, could not start the documented default stack.
    #
    # Compose cannot make a reservation conditional on a variable - there is no
    # way to omit a key - so the choice is which way round the default points. It
    # points at the configuration that needs no special hardware, because that is
    # the one someone evaluating this project starts from, and because a GPU
    # deployment is already choosing `TRANSCRIPTION_DEVICE` and reading the
    # deployment guide.
    expose:
      - "80"
    environment:
      LOG_LEVEL: ${TRANSCRIPTION_LOG_LEVEL:-info}
      API_KEY: ${TRANSCRIPTION_API_KEY}
      WS_INIT_TIMEOUT_SEC: ${TRANSCRIPTION_WS_INIT_TIMEOUT_SEC:-2.5}
      # Read-only key for /metrics/status. Empty leaves the route unregistered.
      # In-cluster only; it is not exposed through nginx.
      METRICS_API_KEY: ${TRANSCRIPTION_METRICS_KEY:-}
      # Optional upstream secret for remote/OpenAI-like providers that read their
      # key from an env var named by provider_config.json's "api_key_env". Empty
      # by default and ignored by local-model providers, so it is safe to leave unset.
      TRANSCRIPTION_PROVIDER_API_KEY: ${TRANSCRIPTION_PROVIDER_API_KEY:-}
      # Silence floor for the ingress audio meter, in linear RMS. Defaulted to
      # the same 0.01 the meter and whisper's own threshold already use, so
      # leaving it unset changes nothing. See .env.example for when a room
      # needs it moved.
      AUDIO_SILENCE_THRESHOLD: ${TRANSCRIPTION_AUDIO_SILENCE_THRESHOLD:-0.01}
      # Fleet telemetry publishing (B1.7). Empty switches it off, which is the
      # default in .env.example: publishing is what puts this host's provider
      # health in the dashboard's fleet view, and nothing else depends on it.
      # TRANSCRIPTION_HOST_ID is left unset deliberately - it defaults to the
      # hostname, which compose sets to the container name, so scaling this
      # service gives each replica a distinct identity with no configuration.
      REDIS_URL: ${TRANSCRIPTION_REDIS_URL:-}
    volumes:
      - ${PROVIDER_CONFIG_PATH:-./provider_config.json}:/app/provider_config.json:ro
    networks:
      - backend
    restart: unless-stopped

  # Monitoring
  #
  # Black-box sidecar: polls the other services' probe and status endpoints,
  # folds them into metrics, and evaluates alert rules. It does not modify the
  # monitored services, so it can be removed from this file with no other edits.
  #
  # It no longer mounts the Docker socket. Until B1.2 it read container logs to
  # infer metrics from log text, which meant root-equivalent host access; every
  # one of those signals now comes from an authed endpoint instead.
  monitoring-sidecar:
    image: ${IMAGE_REGISTRY:-ghcr.io/scribear}/monitoring-sidecar:${IMAGE_TAG:-latest}
    expose:
      - "80"
    environment:
      LOG_LEVEL: ${MONITORING_LOG_LEVEL:-info}
      # Per-provider `job_period_ms` from provider_config.json, as
      # `provider=ms,provider=ms`. It is the denominator of the derived
      # period-utilization series and nothing else — it does not affect RTF,
      # which transcription-service measures for itself, nor the duty-ratio
      # alert, which is deliberately period-independent.
      #
      # Per provider because one number cannot be right: the CUDA templates run
      # whisper and crisper_whisper at 500ms alongside lumen_granite at 3000ms.
      # The single global value this replaces silently misscaled every provider
      # but `debug` — 2x for whisper, 0.33x for lumen_granite, no warning.
      #
      # **Empty by default, on purpose.** Any default would be wrong for
      # somebody: the CUDA templates use 500ms and the CPU templates 5000ms, and
      # shipping either would silently misscale the other — reintroducing the bug
      # in a new place. Unset means the sidecar publishes no utilization series
      # for that provider rather than a confidently wrong one, and the
      # scribear_asr_job_period_ms gauge shows which denominator is in use.
      # Set it in .env to turn the series on:
      #   CUDA templates: whisper=500,crisper_whisper=500,lumen_granite=3000
      #   CPU templates:  whisper=5000,crisper_whisper=5000,lumen_granite=3000
      #
      # A bare integer (this variable's old format) is rejected with an error
      # naming the replacement rather than applied to every provider — a stale
      # .env should be loud, not silently averaged over providers it does not
      # fit. Not `:?`-guarded: a missing denominator must never stop a stack.
      TRANSCRIPTION_JOB_PERIOD_MS: ${MONITORING_JOB_PERIOD_MS:-}
      NODE_SERVER_BASE_URL: http://node-server:80
      SESSION_MANAGER_BASE_URL: http://session-manager:80
      ADMIN_SERVER_BASE_URL: http://admin-server:80
      TRANSCRIPTION_SERVICE_BASE_URL: http://transcription-service:80
      # Reads node-server's authed status endpoint (B1.1). Must match the key
      # node-server is given above; empty disables status polling and leaves
      # the connection, upstream and auth metrics empty.
      NODE_SERVER_SERVICE_API_KEY: ${NODE_SERVER_SERVICE_KEY:?NODE_SERVER_SERVICE_KEY is unset. Your .env predates the monitoring/fleet release - read deployment/UPGRADING.md (or the wiki Deployment page) and add the new keys before starting.}
      NODE_STATUS_INTERVAL_SEC: ${MONITORING_NODE_STATUS_INTERVAL_SEC:-10}
      # Reads transcription-service's authed metrics endpoint (B1.2). Must
      # match the key that service is given above; empty disables the poll.
      TRANSCRIPTION_SERVICE_METRICS_KEY: ${TRANSCRIPTION_METRICS_KEY:-}
      TRANSCRIPTION_METRICS_INTERVAL_SEC: ${MONITORING_TRANSCRIPTION_METRICS_INTERVAL_SEC:-10}
      PROBE_INTERVAL_SEC: ${MONITORING_PROBE_INTERVAL_SEC:-10}
      ALERT_RATE_WINDOW_SEC: ${MONITORING_ALERT_WINDOW_SEC:-120}
      ALERT_UPSTREAM_CHURN_COUNT: ${MONITORING_ALERT_CHURN_COUNT:-3}
      # The transcription T1 thresholds. Plumbed because their right values are
      # hardware-dependent in a way the others are not, and the sidecar's own
      # defaults are calibrated on a GPU: healthy CUDA operation measured mean RTF
      # 0.28-0.33, while the shipped CPU template (small, cpu_threads 4) measured
      # 0.471 keeping up perfectly. So a CPU deployment left on the defaults gets
      # a permanent T1 warning, and without these variables the only remedy was to
      # edit this file. Empty means "use the sidecar default".
      #
      # The wiki's "Transcription on CPU-Only Hardware" page carries measured
      # values per model and thread count.
      ALERT_ASR_DUTY_RATIO: ${MONITORING_ASR_DUTY_RATIO:-}
      # The T1 warning and the T1 CRITICAL, both the share of scheduled job
      # periods in which no pass ran. The CRITICAL is keyed here rather than on
      # p95 RTF because RTF *falls* as the shared worker saturates - measured
      # 0.277 -> 0.139 across 1->8 GPU sessions while transcripts per 1000
      # chunks collapsed 190 -> 48 - so no p95 bar separates healthy from
      # saturated. Drops rose monotonically through the same sweep, and a CPU
      # stack measured 2.9% healthy against 56.3% at 3 sessions.
      ALERT_ASR_DROPPED_PERIOD_RATIO: ${MONITORING_ASR_DROPPED_PERIOD_RATIO:-}
      ALERT_ASR_DROPPED_PERIOD_CRITICAL_RATIO: ${MONITORING_ASR_DROPPED_PERIOD_CRITICAL_RATIO:-}
      # Scheduled periods (`drops + passes`) needed before either share is
      # believed. Matters most on CPU: at the CPU templates' 5000ms period a
      # 120s window holds only ~24 of them, measured, so the default of 20 is
      # met with little to spare. Raise ALERT_RATE_WINDOW_SEC rather than
      # lowering this - but note the counters retain only 300s regardless.
      ALERT_ASR_SCHEDULED_PERIOD_MIN_COUNT: ${MONITORING_ASR_SCHEDULED_PERIOD_MIN_COUNT:-}
      ALERT_ASR_TAIL_MIN_JOBS: ${MONITORING_ASR_TAIL_MIN_JOBS:-}
      # Synthetic canary (A2). Empty disables it entirely, which is the
      # default: the canary needs a registered device, and until one exists
      # there is nothing to authenticate as. The one-time device registration
      # is documented in apps/monitoring-sidecar/.env.example.
      #
      # The canary streams synthetic audio into whatever session is active in
      # its device's room, so that device MUST belong to a dedicated canary
      # room. Pointing it at a real teaching room would inject fixture speech
      # into a live lecture's captions.
      CANARY_DEVICE_TOKEN: ${MONITORING_CANARY_DEVICE_TOKEN:-}
      CANARY_INTERVAL_SEC: ${MONITORING_CANARY_INTERVAL_SEC:-300}
      CANARY_RUN_DURATION_SEC: ${MONITORING_CANARY_RUN_SEC:-40}
      # Must match sample_rate / num_channels in the canary session's
      # transcriptionStreamConfig; the transcription service rejects audio
      # whose WAV header disagrees rather than resampling it.
      CANARY_SAMPLE_RATE: ${MONITORING_CANARY_SAMPLE_RATE:-16000}
      CANARY_CHANNELS: ${MONITORING_CANARY_CHANNELS:-1}
    networks:
      - backend
    restart: unless-stopped

  # Operator test-audio devices (PLAN-TestAudioDevices).
  #
  # Two synthetic source devices an operator can point at a test room from the
  # admin console: `good`, which plays clean speech at an adjustable level and
  # noise floor, and `fault`, which reproduces on demand every audio fault the
  # stack claims to report. It is what lets someone see what an alert looks like
  # before it matters.
  #
  # STARTS WITH THE STACK. It was behind a compose profile while the concern was
  # deployments that had never asked for it; there is one deployment and it
  # wants this, so the profile was only a lever to remember to pull.
  #
  # It does need TEST_AUDIO_SERVICE_KEY set, and exits with a message naming
  # that variable if it is not. Nothing else depends on this service, so that
  # failure is one container rather than a stack that will not come up - which
  # is why the key is not `:?`-guarded here.
  #
  # Running is not the same as armed. Without DEVICE_TOKENs both devices report
  # configured:false and refuse to start, so an unprovisioned generator costs a
  # container and changes no behaviour. Provisioning is the step that arms it.
  #
  # SAFETY: this service holds two long-lived device tokens and streams
  # synthetic audio into whatever session is active in each device's room. A
  # device token reaches ONLY ITS OWN DEVICE'S ROOM - neither device has any way
  # to name another - so the device-to-room assignment made at provisioning time
  # is the entire safety boundary. Each device MUST have its own dedicated test
  # room. Pointing one at a teaching room would inject fixture speech into that
  # lecture's live captions, silently. Use deployment/provision-test-audio.sh,
  # which creates the two rooms and refuses to touch anything else.
  # Operator test-audio devices.
  #
  # Started with the rest of the stack, not behind a profile. It was profiled
  # while the concern was deployments that had never asked for it; there is one
  # deployment and it wants this, so the profile was only a lever to remember to
  # pull. An unprovisioned generator is inert - both devices report
  # `configured: false` and refuse to start until their DEVICE_TOKENs are set -
  # so the cost of it running is a container and no behaviour.
  test-audio-generator:
    image: ${IMAGE_REGISTRY:-ghcr.io/scribear}/test-audio-generator:${IMAGE_TAG:-latest}
    expose:
      - "80"
    environment:
      LOG_LEVEL: ${TEST_AUDIO_LOG_LEVEL:-info}
      # Inbound. Must match admin-server's TEST_AUDIO_SERVICE_KEY above.
      #
      # NOT `:?`-guarded, unlike NODE_SERVER_SERVICE_API_KEY. An empty value
      # here matters more than most, not less: it matches the empty credential
      # an unauthenticated caller presents as `Authorization: Bearer `, on a
      # service that can put audio into a live room.
      #
      # The guard lives in the container instead, which refuses to start on an
      # empty or CHANGEME value with a message naming this variable. So the
      # failure mode for a deployment that has not set the key is this one
      # container exiting and saying why, rather than `docker compose up`
      # refusing to bring up the whole stack. Since this service is no longer
      # behind a profile, that is the difference between one dead container and
      # no ScribeAR at all - which is not a trade worth making for a service
      # nothing else depends on.
      TEST_AUDIO_SERVICE_KEY: ${TEST_AUDIO_SERVICE_KEY:-}
      # The two devices' DEVICE_TOKEN cookie values, {deviceUid}:{secret}, from
      # deployment/provision-test-audio.sh. Empty means that device reports
      # configured:false and refuses to start, which is a disabled card on the
      # admin page rather than an error. NOT `:?`-guarded, unlike the key above:
      # provisioning one device and not the other is a legitimate state, and an
      # unprovisioned device is inert rather than unsafe.
      TEST_AUDIO_GOOD_DEVICE_TOKEN: ${TEST_AUDIO_GOOD_DEVICE_TOKEN:-}
      TEST_AUDIO_FAULT_DEVICE_TOKEN: ${TEST_AUDIO_FAULT_DEVICE_TOKEN:-}
      SESSION_MANAGER_BASE_URL: http://session-manager:80
      NODE_SERVER_BASE_URL: http://node-server:80
      # The authoritative cap on one run. Every run auto-stops at its own
      # durationSec with no further instruction, and this bounds what may be
      # asked for; admin-server's schema rejects only absurd values, so lowering
      # this is obeyed rather than contradicted. It is what stops a forgotten
      # device streaming into a room overnight.
      TEST_AUDIO_MAX_DURATION_SEC: ${TEST_AUDIO_MAX_DURATION_SEC:-1800}
      # Must equal sample_rate / num_channels in the test rooms' sessions'
      # transcriptionStreamConfig; the transcription service rejects audio whose
      # WAV header disagrees rather than resampling it.
      TEST_AUDIO_SAMPLE_RATE: ${TEST_AUDIO_SAMPLE_RATE:-16000}
      TEST_AUDIO_CHANNELS: ${TEST_AUDIO_CHANNELS:-1}
      # Which clip the fault device streams. FaultParams has no clip knob - one
      # knob per fault and nothing else - so the source material is config.
      TEST_AUDIO_FAULT_CLIP: ${TEST_AUDIO_FAULT_CLIP:-harvard}
    depends_on:
      session-manager:
        condition: service_healthy
      node-server:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  # Automatic image updates.
  #
  # Polls the registry and recreates any container whose tag now points at a
  # newer digest. On staging, where IMAGE_TAG=staging and every push to the
  # staging branch republishes it, this is what makes the box continuously
  # deployed without anyone logging in.
  #
  # OFF BY DEFAULT, via the profile: `docker compose up -d` does not start it
  # unless COMPOSE_PROFILES=autoupdate is set. Recreating a container ends every
  # WebSocket it was serving, so an update to node-server or
  # transcription-service drops the live sessions they are carrying - captions
  # simply stop mid-sentence and the kiosk has to reconnect. That is a fair
  # trade on staging and a poor one during a lecture, and it is unattended: with
  # IMAGE_TAG=latest a merge to main would deploy itself. Production wants a
  # chosen moment, so opting in is a per-deployment decision rather than a
  # default.
  #
  # Note also that this mounts the Docker socket, which is root-equivalent on
  # the host. The monitoring sidecar gave up exactly that mount in B1.2; this
  # reintroduces one to the stack, in a container whose whole job is to pull
  # images and restart things. Weigh it as such.
  watchtower:
    profiles:
      - autoupdate
    image: ${WATCHTOWER_IMAGE:-nickfedor/watchtower:latest}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-1800}
      # Without this the superseded image layers are never reclaimed, and a box
      # polling every 30 minutes fills its disk with images nothing references.
      WATCHTOWER_CLEANUP: "true"
      # Empty means "every container on this host", including any that have
      # nothing to do with ScribeAR. Set a scope and label the containers that
      # should be updated to narrow it - see deployment/UPGRADING.md.
      WATCHTOWER_SCOPE: ${WATCHTOWER_SCOPE:-}
    # No network: it talks to the Docker socket and the registry, never to
    # another service in this stack.
    restart: unless-stopped

networks:
  frontend:
  backend:

volumes:
  postgres_data:
