services:
  # Reverse Proxy
  nginx:
    image: ${IMAGE_REGISTRY:-ghcr.io/scribear}/scribear-nginx:${IMAGE_TAG:-latest}
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ${SSL_CERT_PATH}:/etc/nginx/ssl/pub.cert:ro
      - ${SSL_KEY_PATH}:/etc/nginx/ssl/priv.key:ro
    depends_on:
      client-webapp:
        condition: service_healthy
      standalone-webapp:
        condition: service_healthy
      kiosk-webapp:
        condition: service_healthy
      node-server:
        condition: service_healthy
      session-manager:
        condition: service_healthy
      admin-webapp:
        condition: service_healthy
      admin-server:
        condition: service_healthy
    networks:
      - frontend
      - backend
    restart: unless-stopped

  # Frontend Webapps
  client-webapp:
    image: ${IMAGE_REGISTRY:-ghcr.io/scribear}/client-webapp:${IMAGE_TAG:-latest}
    expose:
      - "80"
    networks:
      - frontend
    restart: unless-stopped

  standalone-webapp:
    image: ${IMAGE_REGISTRY:-ghcr.io/scribear}/standalone-webapp:${IMAGE_TAG:-latest}
    expose:
      - "80"
    networks:
      - frontend
    restart: unless-stopped

  kiosk-webapp:
    image: ${IMAGE_REGISTRY:-ghcr.io/scribear}/kiosk-webapp:${IMAGE_TAG:-latest}
    expose:
      - "80"
    networks:
      - frontend
    restart: unless-stopped

  admin-webapp:
    image: ${IMAGE_REGISTRY:-ghcr.io/scribear}/admin-webapp:${IMAGE_TAG:-latest}
    expose:
      - "80"
    networks:
      - frontend
    restart: unless-stopped

  # Backend APIs
  session-manager:
    image: ${IMAGE_REGISTRY:-ghcr.io/scribear}/session-manager:${IMAGE_TAG:-latest}
    expose:
      - "80"
    environment:
      LOG_LEVEL: ${SESSION_MANAGER_LOG_LEVEL:-info}
      ADMIN_API_KEY: ${SESSION_MANAGER_API_KEY}
      SESSION_MANAGER_SERVICE_API_KEY: ${NODE_SERVER_KEY}
      SESSION_TOKEN_SIGNING_KEY: ${JWT_SECRET}
      DB_HOST: scribear-db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      scribear-db:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  admin-server:
    image: ${IMAGE_REGISTRY:-ghcr.io/scribear}/admin-server:${IMAGE_TAG:-latest}
    expose:
      - "80"
    environment:
      LOG_LEVEL: ${ADMIN_LOG_LEVEL:-info}
      ADMIN_API_KEY: ${SESSION_MANAGER_API_KEY}
      SESSION_MANAGER_BASE_URL: http://session-manager:80
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}
      ADMIN_LOCAL_CREDENTIALS: ${ADMIN_LOCAL_CREDENTIALS}
      DB_HOST: scribear-db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      session-manager:
        condition: service_healthy
      scribear-db:
        condition: service_healthy
    networks:
      - frontend
      - backend
    restart: unless-stopped

  node-server:
    image: ${IMAGE_REGISTRY:-ghcr.io/scribear}/node-server:${IMAGE_TAG:-latest}
    expose:
      - "80"
    environment:
      LOG_LEVEL: ${NODE_SERVER_LOG_LEVEL:-info}
      NODE_SERVER_SERVICE_API_KEY: ${NODE_SERVER_SERVICE_KEY}
      SESSION_TOKEN_SIGNING_KEY: ${JWT_SECRET}
      SESSION_MANAGER_BASE_URL: http://session-manager:80
      SESSION_MANAGER_SERVICE_API_KEY: ${NODE_SERVER_KEY}
      TRANSCRIPTION_SERVICE_BASE_URL: http://transcription-service:80
      TRANSCRIPTION_SERVICE_API_KEY: ${TRANSCRIPTION_API_KEY}
    depends_on:
      transcription-service:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  # Infrastructure
  scribear-db:
    image: ${IMAGE_REGISTRY:-ghcr.io/scribear}/scribear-db:${IMAGE_TAG:-latest}
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  transcription-service:
    image: ${IMAGE_REGISTRY:-ghcr.io/scribear}/transcription-service-${TRANSCRIPTION_DEVICE:-cpu}:${IMAGE_TAG:-latest}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    expose:
      - "80"
    environment:
      LOG_LEVEL: ${TRANSCRIPTION_LOG_LEVEL:-info}
      API_KEY: ${TRANSCRIPTION_API_KEY}
      WS_INIT_TIMEOUT_SEC: ${TRANSCRIPTION_WS_INIT_TIMEOUT_SEC:-2.5}
      # Read-only key for /metrics/status. Empty leaves the route unregistered.
      # In-cluster only; it is not exposed through nginx.
      METRICS_API_KEY: ${TRANSCRIPTION_METRICS_KEY:-}
      # Optional upstream secret for remote/OpenAI-like providers that read their
      # key from an env var named by provider_config.json's "api_key_env". Empty
      # by default and ignored by local-model providers, so it is safe to leave unset.
      TRANSCRIPTION_PROVIDER_API_KEY: ${TRANSCRIPTION_PROVIDER_API_KEY:-}
    volumes:
      - ${PROVIDER_CONFIG_PATH:-./provider_config.json}:/app/provider_config.json:ro
    networks:
      - backend
    restart: unless-stopped

  # Monitoring
  #
  # Black-box sidecar: parses the other services' JSON logs into metrics, polls
  # their probes, and evaluates alert rules. It does not modify or depend on the
  # monitored services, so it can be removed from this file with no other edits.
  #
  # SECURITY: the Docker socket is mounted to read container logs. That is
  # root-equivalent access to the host, granted here read-only and used only for
  # GET /containers/json and GET /containers/<id>/logs. If that trade is not
  # acceptable in a given deployment, drop this service and switch to a log
  # shipping driver instead.
  monitoring-sidecar:
    image: ${IMAGE_REGISTRY:-ghcr.io/scribear}/monitoring-sidecar:${IMAGE_TAG:-latest}
    expose:
      - "80"
    environment:
      LOG_LEVEL: ${MONITORING_LOG_LEVEL:-info}
      # Must match the compose project name, or container discovery finds
      # nothing and the sidecar silently collects no logs.
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-deployment}
      # Must match job_period_ms in provider_config.json; it is the denominator
      # of the period-utilization metric.
      TRANSCRIPTION_JOB_PERIOD_MS: ${MONITORING_JOB_PERIOD_MS:-1000}
      NODE_SERVER_BASE_URL: http://node-server:80
      SESSION_MANAGER_BASE_URL: http://session-manager:80
      ADMIN_SERVER_BASE_URL: http://admin-server:80
      TRANSCRIPTION_SERVICE_BASE_URL: http://transcription-service:80
      # Reads node-server's authed status endpoint (B1.1). Must match the key
      # node-server is given above; empty disables status polling and leaves
      # the connection, upstream and auth metrics empty.
      NODE_SERVER_SERVICE_API_KEY: ${NODE_SERVER_SERVICE_KEY}
      NODE_STATUS_INTERVAL_SEC: ${MONITORING_NODE_STATUS_INTERVAL_SEC:-10}
      # Reads transcription-service's authed metrics endpoint (B1.2). Must
      # match the key that service is given above; empty disables the poll.
      TRANSCRIPTION_SERVICE_METRICS_KEY: ${TRANSCRIPTION_METRICS_KEY:-}
      TRANSCRIPTION_METRICS_INTERVAL_SEC: ${MONITORING_TRANSCRIPTION_METRICS_INTERVAL_SEC:-10}
      PROBE_INTERVAL_SEC: ${MONITORING_PROBE_INTERVAL_SEC:-10}
      ALERT_RATE_WINDOW_SEC: ${MONITORING_ALERT_WINDOW_SEC:-120}
      ALERT_UPSTREAM_CHURN_COUNT: ${MONITORING_ALERT_CHURN_COUNT:-3}
      # Synthetic canary (A2). Empty disables it entirely, which is the
      # default: the canary needs a registered device, and until one exists
      # there is nothing to authenticate as. The one-time device registration
      # is documented in apps/monitoring-sidecar/.env.example.
      #
      # The canary streams synthetic audio into whatever session is active in
      # its device's room, so that device MUST belong to a dedicated canary
      # room. Pointing it at a real teaching room would inject fixture speech
      # into a live lecture's captions.
      CANARY_DEVICE_TOKEN: ${MONITORING_CANARY_DEVICE_TOKEN:-}
      CANARY_INTERVAL_SEC: ${MONITORING_CANARY_INTERVAL_SEC:-300}
      CANARY_RUN_DURATION_SEC: ${MONITORING_CANARY_RUN_SEC:-40}
      # Must match sample_rate / num_channels in the canary session's
      # transcriptionStreamConfig; the transcription service rejects audio
      # whose WAV header disagrees rather than resampling it.
      CANARY_SAMPLE_RATE: ${MONITORING_CANARY_SAMPLE_RATE:-16000}
      CANARY_CHANNELS: ${MONITORING_CANARY_CHANNELS:-1}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - backend
    restart: unless-stopped

networks:
  frontend:
  backend:

volumes:
  postgres_data:
