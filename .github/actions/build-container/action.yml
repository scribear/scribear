name: "Build Containers"
description: "Builds linux/amd64 docker images and publishes them to GHCR. Reads (and on branch builds writes) a registry build cache to keep build times down."
inputs:
  image_name:
    description: "Container image name (e.g., scribear/app)."
    required: true
  build_context:
    description: "Docker build context."
    required: true
  dockerfile:
    description: "Path to the Dockerfile."
    required: true
  cache_variant:
    description: >
      Branch whose build cache this run should write ('staging', 'main').
      Leave empty to build read-only, which is what PR CI wants: every PR shared
      a single `buildcache-pr` tag, so a PR almost always imported some other
      PR's cache while still paying ~55s per image to export its own.
      staging/main caches are read either way.
    required: false
    default: ''
  custom_tags:
    description: >
      Newline-delimited tags to publish, from resolve-container-tags. Empty
      means build without publishing: the image is still compiled, which is all
      a PR needs, but nothing is pushed.
    required: false
    default: ""
  build_args:
    description: "Optional newline-delimited --build-arg values (KEY=value) passed to every build step."
    required: false
    default: ""
  github_token:
    description: "GITHUB_TOKEN used to authenticate to ghcr.io."
    required: true
runs:
  using: "composite"
  steps:
    # An empty tag list used to fall back to docker/metadata-action's defaults,
    # which quietly published a branch- or pr-named tag. Now it means exactly
    # what it says: build, do not publish.
    - name: Resolve Metadata Tags
      id: resolved-tags
      shell: bash
      env:
        CUSTOM_TAGS: ${{ inputs.custom_tags }}
      run: |
        {
          echo 'tags<<EOF'
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              printf 'type=raw,value=%s\n' "$tag"
            fi
          done <<< "$CUSTOM_TAGS"
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"

        if [ -n "$(echo "$CUSTOM_TAGS" | tr -d '[:space:]')" ]; then
          echo "has_tags=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_tags=false" >> "$GITHUB_OUTPUT"
          echo "No tags resolved - building without publishing."
        fi

    # Generate tags and labels for the Docker image.
    # GHCR only: DockerHub is retired as a publish target.
    - name: Generate Container Metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ inputs.image_name }}
        tags: ${{ steps.resolved-tags.outputs.tags }}

    # - name: Set up QEMU
    #   uses: docker/setup-qemu-action@v3

    # The mirror below only covers images BuildKit pulls; the buildkit image
    # itself is pulled by the host daemon straight from docker.io when the
    # builder boots, with no retry and no fallback. A single slow response
    # there (`registry-1.docker.io/v2/: context deadline exceeded`) failed the
    # job before a Dockerfile line had been read. Seed it here instead:
    # mirror first, docker.io second, three attempts each. Once the image is
    # local, `buildx create --bootstrap` reuses it and never reaches out.
    # A total miss is a warning, not an error - buildx still gets its own try.
    - name: Pre-pull BuildKit image
      shell: bash
      env:
        BUILDKIT_IMAGE: moby/buildkit:buildx-stable-1
      run: |
        for ref in "mirror.gcr.io/$BUILDKIT_IMAGE" "$BUILDKIT_IMAGE"; do
          for attempt in 1 2 3; do
            if docker pull "$ref"; then
              docker tag "$ref" "$BUILDKIT_IMAGE"
              exit 0
            fi
            sleep $((attempt * 5))
          done
        done
        echo "::warning::Could not pre-pull $BUILDKIT_IMAGE; letting buildx try."

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        # Pull docker.io base images (node, nginx, postgres, nvidia/cuda) through
        # Google's public mirror. Even authenticated, a Docker Personal account's
        # hourly pull allowance does not cover a dozen images per run across many
        # concurrent PRs - that is what produced the `429 Too Many Requests` on
        # nvidia/cuda. BuildKit falls back to docker.io when the mirror lacks an
        # image, so this is a pure win. Pushes are unaffected (mirrors are
        # pull-only).
        buildkitd-config-inline: |
          [registry."docker.io"]
            mirrors = ["mirror.gcr.io"]

    # Fork PRs run with a read-only GITHUB_TOKEN, so they cannot push or write
    # cache. Detect that case and build-only (which still validates the image
    # compiles) instead of failing on an unauthenticated push.
    - name: Determine push eligibility
      id: eligibility
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        REPO: ${{ github.repository }}
      run: |
        if [ "$EVENT_NAME" = "pull_request" ] && [ "$HEAD_REPO" != "$REPO" ]; then
          echo "can_push=false" >> "$GITHUB_OUTPUT"
        else
          echo "can_push=true" >> "$GITHUB_OUTPUT"
        fi

    # GHCR is the only registry now; the build cache is read from it even when
    # nothing will be published, so this login is not gated on push eligibility
    # beyond the fork check below.
    - name: Login to GHCR
      if: steps.eligibility.outputs.can_push == 'true'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github_token }}

    # One build step, not two. The old build-then-push split existed so each
    # architecture could own its buildcache tag instead of clobbering the other's;
    # with the arm64 build disabled (see below) there is only one architecture, so
    # the second invocation just replayed the first from local cache - ~17s and six
    # more registry manifest reads per image, for nothing.
    #
    # Cache lives on GHCR only (GITHUB_TOKEN auth, no pull limits). The DockerHub
    # cache reads that used to sit alongside these were 54 DockerHub requests per
    # node-ci run before a single base image was pulled, which is a large part of
    # what exhausted the account's pull allowance.
    #
    # `mode` is deliberately absent from cache-from: it is a cache-to option and
    # was silently ignored on every one of these refs.
    - name: Build and Push
      uses: docker/build-push-action@v6
      with:
        # Publish only when there is something to publish and we are allowed to.
        push: ${{ steps.eligibility.outputs.can_push == 'true' && steps.resolved-tags.outputs.has_tags == 'true' }}
        context: ${{ inputs.build_context }}
        file: ${{ inputs.dockerfile }}
        platforms: "linux/amd64"
        # platforms: "linux/amd64,linux/arm64"
        build-args: ${{ inputs.build_args }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: |
          type=registry,ref=ghcr.io/${{ inputs.image_name }}:buildcache-staging-linux-amd64
          type=registry,ref=ghcr.io/${{ inputs.image_name }}:buildcache-main-linux-amd64
        # Written only on a branch build (cache_variant set) and never on fork PRs,
        # whose read-only token cannot push to GHCR.
        cache-to: ${{ (inputs.cache_variant != '' && steps.eligibility.outputs.can_push == 'true') && format('type=registry,mode=max,ref=ghcr.io/{0}:buildcache-{1}-linux-amd64', inputs.image_name, inputs.cache_variant) || '' }}

    # Disable arm builds due to extremely slow github actions.
    # Restoring arm64 means going back to per-architecture build steps with
    # separate buildcache tags, then a final manifest-only push - see git history
    # for the shape that had.
