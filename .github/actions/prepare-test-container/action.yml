name: "Prepare Test Containers"
description: "Builds docker containers locally with 'test' tag to prepare for integration and e2e tests. Pulls from buildcaches to reduce build times."
inputs:
  image_name:
    description: "Container image name (e.g., scribear/app)."
    required: true
  build_context:
    description: "Docker build context."
    required: true
  dockerfile:
    description: "Path to the Dockerfile."
    required: true
  target:
    description: >
      The Dockerfile stage to build. Empty means the default final stage - see
      build-container for why this is needed now that one Dockerfile builds
      every Node app under a per-app target.
    required: false
    default: ""
  github_token:
    description: "GITHUB_TOKEN used to read the GHCR build cache."
    required: true
runs:
  using: "composite"
  steps:
    # See build-container for why the buildkit image is seeded before the
    # builder boots: the host daemon's pull of it bypasses the mirror below.
    - name: Pre-pull BuildKit image
      shell: bash
      env:
        BUILDKIT_IMAGE: moby/buildkit:buildx-stable-1
      run: |
        for ref in "mirror.gcr.io/$BUILDKIT_IMAGE" "$BUILDKIT_IMAGE"; do
          for attempt in 1 2 3; do
            if docker pull "$ref"; then
              docker tag "$ref" "$BUILDKIT_IMAGE"
              exit 0
            fi
            sleep $((attempt * 5))
          done
        done
        echo "::warning::Could not pre-pull $BUILDKIT_IMAGE; letting buildx try."

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        # See build-container for why base images are pulled through a mirror.
        buildkitd-config-inline: |
          [registry."docker.io"]
            mirrors = ["mirror.gcr.io"]

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github_token }}

    - name: Build Test Container
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.build_context }}
        file: ${{ inputs.dockerfile }}
        target: ${{ inputs.target }}
        tags: ${{ inputs.image_name }}:test
        push: false
        load: true
        # GHCR only, and only the branch caches: nothing writes a `buildcache-pr`
        # tag any more, and the DockerHub mirrors of these were burning the
        # account's pull allowance. See build-container for the full reasoning.
        cache-from: |
          type=registry,ref=ghcr.io/${{ inputs.image_name }}:buildcache-staging-linux-amd64
          type=registry,ref=ghcr.io/${{ inputs.image_name }}:buildcache-main-linux-amd64
