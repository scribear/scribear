name: Python CI

on:
  pull_request:
    branches:
      - main
      - staging
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write
  pull-requests: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      transcription_service: ${{ steps.filter.outputs.transcription_service }}
      image_matrix: ${{ steps.image_matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5

      - name: Detect Changed Paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            transcription_service:
              - 'transcription_service/**'

      - name: Resolve transcription image matrix
        id: image_matrix
        uses: ./.github/actions/transcription-image-matrix

  format:
    needs: changes
    if: needs.changes.outputs.transcription_service == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python
        uses: ./.github/actions/setup-python

      - name: Check formatting
        working-directory: "transcription_service"
        run: make format

  lint:
    needs: changes
    if: needs.changes.outputs.transcription_service == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python
        uses: ./.github/actions/setup-python

      - name: Run linter
        working-directory: "transcription_service"
        run: make lint

  test:
    needs: changes
    if: needs.changes.outputs.transcription_service == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python
        uses: ./.github/actions/setup-python

      - name: Run unit tests
        working-directory: "transcription_service"
        run: make test_unit

      - name: Code Coverage Report - Transcription Service Unit Tests
        uses: ./.github/actions/coverage-report
        with:
          package_name: "Transcription Service - Unit Tests"
          filename: "./transcription_service/coverage.xml"

  docker-build:
    needs: [changes, format, lint, test]
    if: needs.changes.outputs.transcription_service == 'true'
    # One parallel job per image: the CPU build plus every CUDA variant in
    # transcription_service/cuda-variants.json. fail-fast stays off so a broken
    # new CUDA base image does not cancel the builds of the working ones.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.image_matrix) }}
    name: docker-build (${{ matrix.image_name }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve image tags
        id: tags
        uses: ./.github/actions/resolve-container-tags
        with:
          version_file: ${{ matrix.version_file }}

      - name: Build Container
        uses: ./.github/actions/build-container
        with:
          image_name: ${{ matrix.image_name }}
          build_context: ${{ matrix.build_context }}
          dockerfile: ${{ matrix.dockerfile }}
          build_args: ${{ matrix.build_args }}
          cache_variant: pr
          custom_tags: ${{ steps.tags.outputs.tags }}
          dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub_password: ${{ secrets.DOCKERHUB_PASSWORD }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  integration-test:
    needs: [changes, format, lint, test, docker-build]
    if: needs.changes.outputs.transcription_service == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python
        uses: ./.github/actions/setup-python

      - name: Run Transcription Service Integration Tests
        working-directory: "transcription_service"
        run: make test_integration

      - name: Code Coverage Report - Transcription Service Integration Tests
        uses: ./.github/actions/coverage-report
        with:
          package_name: "Transcription Service - Integration Tests"
          filename: "./transcription_service/coverage.xml"

  python-ci:
    needs: [format, lint, test, docker-build, integration-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check All Jobs Pass
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          for result in $results; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "Job failed with result: $result"
              exit 1
            fi
          done
