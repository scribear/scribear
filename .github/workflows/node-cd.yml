name: Node.js CD

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write

# Deployments queue rather than cancel: a superseded CD run may already have
# pushed images or deployed, so letting it finish keeps the registry and the
# deploy target consistent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      workspaces: ${{ steps.changes.outputs.workspaces }}
      has_changes: ${{ steps.changes.outputs.has_changes }}
      image_matrix: ${{ steps.image_matrix.outputs.matrix }}
      has_images: ${{ steps.image_matrix.outputs.has_images }}
    steps:
      # fetch-depth: 0 so detect-changes can diff against the previous commit.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect Changed Workspaces
        id: changes
        uses: ./.github/actions/detect-changes

      - name: Resolve node image matrix
        id: image_matrix
        uses: ./.github/actions/node-image-matrix
        with:
          workspaces: ${{ steps.changes.outputs.workspaces }}

  # Seeds the node_modules cache on the default branch. GitHub only lets a PR
  # restore caches from its own branch or its base, so without this every new
  # PR would pay for a cold `npm ci` in all six of its Node jobs; with it, only
  # a lockfile change does. Costs ~10s when the lockfile is unchanged.
  warm-dependency-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node

  docker-build:
    needs: [changes]
    if: needs.changes.outputs.has_images == 'true'
    # Matrix lives in .github/node-images.json, shared with node-ci, and is
    # already filtered to the affected images.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.image_matrix) }}
    name: docker-build (${{ matrix.image_name }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve image tags
        id: tags
        uses: ./.github/actions/resolve-container-tags
        with:
          version_file: ${{ matrix.version_file }}

      - name: Build Container
        uses: ./.github/actions/build-container
        with:
          image_name: ${{ matrix.image_name }}
          build_context: ${{ matrix.build_context }}
          dockerfile: ${{ matrix.dockerfile }}
          cache_variant: ${{ github.ref_name }}
          custom_tags: ${{ steps.tags.outputs.tags }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  deploy-standalone-webapp:
    needs: [changes, docker-build]
    if: contains(needs.changes.outputs.workspaces, 'apps/standalone-webapp') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node

      - name: Run build
        run: npm run build --workspace @scribear/standalone-webapp

      - name: Label build date and commit hash
        run: |
          date > apps/standalone-webapp/dist/builddate.txt
          git rev-parse --short HEAD > apps/standalone-webapp/dist/commit.txt

      - name: Deploy to Production
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY_2026 }}
          GIT_SSH_COMMAND: "ssh -o StrictHostKeyChecking=no"
        run: |
          eval "$(ssh-agent -s)"
          ssh-add - <<< "${DEPLOY_KEY}"
          git clone --depth 1 --single-branch --branch master git@github.com:scribear/v.git
          git config --global user.email "angrave@illinois.edu"
          git config --global user.name "scribear-bot"
          cd v
          ls -la
          export SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-8)"

          git checkout --orphan "deploy-${SHORT_SHA}"
          git rm -rf --ignore-unmatch latest-v2

          mkdir -p latest-v2
          cp -a ../apps/standalone-webapp/dist/. latest-v2/
          git add -A

          git commit -m "Commit Deploy: ${SHORT_SHA}"
          git push --force-with-lease origin HEAD:master
