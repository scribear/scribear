name: Node.js CD

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write

# Deployments queue rather than cancel: a superseded CD run may already have
# pushed images or deployed, so letting it finish keeps the registry and the
# deploy target consistent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      workspaces: ${{ steps.changes.outputs.workspaces }}
      has_changes: ${{ steps.changes.outputs.has_changes }}
      image_matrix: ${{ steps.image_matrix.outputs.matrix }}
      has_images: ${{ steps.image_matrix.outputs.has_images }}
      build_matrix: ${{ steps.image_matrix.outputs.build_matrix }}
    steps:
      # fetch-depth: 0 so detect-changes can diff against the previous commit.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect Changed Workspaces
        id: changes
        uses: ./.github/actions/detect-changes

      - name: Resolve node image matrix
        id: image_matrix
        uses: ./.github/actions/node-image-matrix
        with:
          workspaces: ${{ steps.changes.outputs.workspaces }}

  # Seeds the node_modules cache on the default branch. GitHub only lets a PR
  # restore caches from its own branch or its base, so without this every new
  # PR would pay for a cold `npm ci` in all six of its Node jobs; with it, only
  # a lockfile change does. Costs ~10s when the lockfile is unchanged.
  warm-dependency-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node

  # One job per (image, native runner arch) pair - see APPLE-SILICON-FINDINGS.md
  # for why native ubuntu-24.04-arm rather than QEMU (measured 9.9x slower on
  # the CPU transcription image). Each leg pushes its half of the image by
  # digest; docker-merge below combines the two digests into one multi-arch
  # manifest under the real tags. Scoped to the Node and infra images in
  # .github/node-images.json only - the three transcription images
  # (python-cd.yml) stay amd64-only for now, since they are the more expensive
  # legs to add and nothing on this list needs them to build a Mac dev stack.
  docker-build:
    needs: [changes]
    if: needs.changes.outputs.has_images == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.build_matrix) }}
    name: docker-build (${{ matrix.image_name }}, ${{ matrix.platform }})
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve image tags
        id: tags
        uses: ./.github/actions/resolve-container-tags
        with:
          version_file: ${{ matrix.version_file }}

      - name: Build Container
        uses: ./.github/actions/build-container
        with:
          image_name: ${{ matrix.image_name }}
          build_context: ${{ matrix.build_context }}
          dockerfile: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build_args: ${{ steps.tags.outputs.build_args }}
          cache_variant: ${{ github.ref_name }}
          custom_tags: ${{ steps.tags.outputs.tags }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          platforms: ${{ matrix.platform }}
          push_by_digest: "true"

  # Combines each image's per-arch digests (uploaded as artifacts by
  # build-container above, one matrix job per image so a slow image's merge
  # cannot block a fast one's) into a single multi-arch manifest under the real
  # tags, via `docker buildx imagetools create`. This is the "final
  # manifest-only push" the old comment in build-container referred to.
  docker-merge:
    needs: [changes, docker-build]
    if: needs.changes.outputs.has_images == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.image_matrix) }}
    name: docker-merge (${{ matrix.image_name }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve image tags
        id: tags
        uses: ./.github/actions/resolve-container-tags
        with:
          version_file: ${{ matrix.version_file }}

      # Matches nothing (and the download step below finds no files) on a build
      # that resolved no tags - identical to the old "build without publishing"
      # case, just discovered here instead of inside build-container.
      - name: Download digests
        if: steps.tags.outputs.tags != ''
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image_slug }}-*
          merge-multiple: true

      - name: Login to GHCR
        if: steps.tags.outputs.tags != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.tags.outputs.tags != ''
        uses: docker/setup-buildx-action@v3

      - name: Create and push the multi-arch manifest
        if: steps.tags.outputs.tags != ''
        working-directory: /tmp/digests
        env:
          IMAGE_NAME: ${{ matrix.image_name }}
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          tag_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && tag_args+=(-t "ghcr.io/${IMAGE_NAME}:${tag}")
          done <<< "$TAGS"

          digest_refs=()
          for digest in *; do
            digest_refs+=("ghcr.io/${IMAGE_NAME}@sha256:${digest}")
          done

          docker buildx imagetools create "${tag_args[@]}" "${digest_refs[@]}"

      - name: Inspect the published manifest
        if: steps.tags.outputs.tags != ''
        env:
          IMAGE_NAME: ${{ matrix.image_name }}
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          first_tag=$(echo "$TAGS" | head -n1)
          docker buildx imagetools inspect "ghcr.io/${IMAGE_NAME}:${first_tag}"

  # Gives the release's v<version> tag to the images this push did NOT rebuild.
  #
  # deployment/compose.yml pins all sixteen services with one ${IMAGE_TAG}, so
  # `IMAGE_TAG=v0.3.0` only resolves if every image carries that tag. Change
  # detection means a push to main rebuilds only the images whose workspace it
  # touched, so an image that did not change gets no release tag at all and
  # pinning the stack to a version fails on it - not with a useful message,
  # but with a manifest-unknown pull error on one service. Live proof at the
  # time of writing: test-audio-generator stopped at v0.1.0 while everything
  # else reached v0.2.0, so `IMAGE_TAG=v0.2.0` cannot start the stack today.
  #
  # A release commit hides this, because bumping every package.json marks every
  # workspace changed and so rebuilds everything - but that is a side effect of
  # how versions happen to be bumped, not a guarantee, and it does not survive a
  # hotfix promoted to main on its own.
  #
  # Retag, don't rebuild: `imagetools create` copies the manifest registry-side.
  # Measured against a real multi-arch image from this registry - source and new
  # tag report the identical digest (sha256:553e627e...) with linux/amd64 and
  # linux/arm64 both intact - so the release tag is an alias for the same bits,
  # not a second build carrying a different provenance stamp. (It re-wraps into
  # a fresh index only when the source is a single-arch manifest, which nothing
  # docker-merge publishes ever is.)
  #
  # An existing v<version> is never moved, only missing ones are created, so
  # re-running this can add a tag but can never re-point one.
  #
  # main only: the staging tags are `staging` and `staging-<sha>`, and an
  # unchanged image's `staging` tag already points at its last build, which is
  # the right answer there. python-cd needs no equivalent - it rebuilds all
  # three transcription images on every push to main, changed or not.
  backfill-release-tags:
    needs: [changes, docker-merge]
    # Runs whether or not docker-merge had anything to do (no changed images at
    # all still needs the tags), but never after it failed: a half-published
    # release must not have the rest of the stack labelled as that version.
    if: >-
      !cancelled()
      && github.ref == 'refs/heads/main'
      && needs.docker-merge.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Tag every image this push did not rebuild
        env:
          # Only the images that were rebuilt; everything else in
          # node-images.json is what this job is for.
          IMAGE_MATRIX: ${{ needs.changes.outputs.image_matrix }}
        run: |
          node <<'JS' > /tmp/pending.tsv
          const { readFileSync } = require('fs');

          const images = JSON.parse(
            readFileSync('.github/node-images.json', 'utf8'),
          );
          // Each image's own version file, not one global version: they agree
          // today because changesets moves the npm packages as a fixed group,
          // and reading each one keeps this correct if that ever stops.
          const built = new Set(
            JSON.parse(process.env.IMAGE_MATRIX || '{"include":[]}').include.map(
              (image) => image.image_name,
            ),
          );
          for (const image of images) {
            if (built.has(image.image_name)) continue;
            const { version } = JSON.parse(
              readFileSync(image.version_file, 'utf8'),
            );
            process.stdout.write(`${image.image_name}\t${version}\n`);
          }
          JS

          if [ ! -s /tmp/pending.tsv ]; then
            echo "This push rebuilt every image; docker-merge already tagged them."
            exit 0
          fi

          while IFS=$'\t' read -r image version; do
            release="ghcr.io/${image}:v${version}"
            latest="ghcr.io/${image}:latest"

            if docker buildx imagetools inspect "$release" >/dev/null 2>&1; then
              echo "= ${release} already published - left where it points."
              continue
            fi

            if ! docker buildx imagetools inspect "$latest" >/dev/null 2>&1; then
              echo "! ${latest} does not exist: ${image} has never been released, so there is no manifest to tag. Skipping."
              continue
            fi

            echo "+ ${release} -> the manifest currently tagged latest"
            docker buildx imagetools create -t "$release" "$latest"
          done < /tmp/pending.tsv

  deploy-standalone-webapp:
    needs: [changes, docker-merge]
    if: contains(needs.changes.outputs.workspaces, 'apps/standalone-webapp') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node

      - name: Run build
        run: npm run build --workspace @scribear/standalone-webapp

      - name: Label build date and commit hash
        run: |
          date > apps/standalone-webapp/dist/builddate.txt
          git rev-parse --short HEAD > apps/standalone-webapp/dist/commit.txt

      - name: Deploy to Production
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY_2026 }}
          GIT_SSH_COMMAND: "ssh -o StrictHostKeyChecking=no"
        run: |
          eval "$(ssh-agent -s)"
          ssh-add - <<< "${DEPLOY_KEY}"
          git clone --depth 1 --single-branch --branch master git@github.com:scribear/v.git
          git config --global user.email "angrave@illinois.edu"
          git config --global user.name "scribear-bot"
          cd v
          ls -la
          export SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-8)"

          git checkout --orphan "deploy-${SHORT_SHA}"
          git rm -rf --ignore-unmatch latest-v2

          mkdir -p latest-v2
          cp -a ../apps/standalone-webapp/dist/. latest-v2/
          git add -A

          git commit -m "Commit Deploy: ${SHORT_SHA}"
          git push --force-with-lease origin HEAD:master
