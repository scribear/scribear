name: Node.js CI

on:
  pull_request:
    branches:
      - main
      - staging
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write
  pull-requests: write

# Pushing again to an open PR should abandon the previous run, not race it. Six
# overlapping runs of the same PR were routine, each holding ~15 runners and
# each pulling its own base images - a large part of why builds started hitting
# registry rate limits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      workspaces: ${{ steps.changes.outputs.workspaces }}
      has_changes: ${{ steps.changes.outputs.has_changes }}
      image_matrix: ${{ steps.image_matrix.outputs.matrix }}
      has_images: ${{ steps.image_matrix.outputs.has_images }}
    steps:
      # fetch-depth: 0 so detect-changes can diff against the PR base commit.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect Changed Workspaces
        id: changes
        uses: ./.github/actions/detect-changes

      - name: Resolve node image matrix
        id: image_matrix
        uses: ./.github/actions/node-image-matrix
        with:
          workspaces: ${{ steps.changes.outputs.workspaces }}

  format:
    needs: changes
    if: needs.changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Check formatting
        env:
          WORKSPACES: ${{ needs.changes.outputs.workspaces }}
        run: .github/scripts/run-workspaces.sh format

  lint:
    needs: changes
    if: needs.changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Run linter
        env:
          WORKSPACES: ${{ needs.changes.outputs.workspaces }}
        run: .github/scripts/run-workspaces.sh lint

  build:
    needs: changes
    if: needs.changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: ./.github/actions/setup-node

      # Serial on purpose. `tsc --build` also builds a workspace's referenced
      # projects, so two concurrent invocations can race writing the same
      # dist/ and .tsbuildinfo for a shared lib.
      - name: Run build
        env:
          WORKSPACES: ${{ needs.changes.outputs.workspaces }}
          IF_PRESENT: "true"
          CONCURRENCY: "1"
        run: .github/scripts/run-workspaces.sh build

  test:
    needs: changes
    if: needs.changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: ./.github/actions/setup-node

      # Serial on purpose. Vitest already runs its own worker pool per
      # workspace; stacking workspaces on top would oversubscribe the runner
      # and make timing-sensitive tests flaky.
      - name: Run unit tests
        env:
          WORKSPACES: ${{ needs.changes.outputs.workspaces }}
          IF_PRESENT: "true"
          CONCURRENCY: "1"
        run: .github/scripts/run-workspaces.sh test:unit

      - name: Code Coverage Report - Base Fastify Server Unit Tests
        if: contains(needs.changes.outputs.workspaces, 'libs/base-fastify-server')
        uses: ./.github/actions/coverage-report
        with:
          package_name: "Base Fastify Server - Unit Tests"
          filename: "./libs/base-fastify-server/coverage/cobertura-coverage.xml"

      - name: Code Coverage Report - Session Manager Unit Tests
        if: contains(needs.changes.outputs.workspaces, 'apps/session-manager')
        uses: ./.github/actions/coverage-report
        with:
          package_name: "Session Manager - Unit Tests"
          filename: "./apps/session-manager/coverage/cobertura-coverage.xml"

      - name: Code Coverage Report - Node Server Unit Tests
        if: contains(needs.changes.outputs.workspaces, 'apps/node-server')
        uses: ./.github/actions/coverage-report
        with:
          package_name: "Node Server - Unit Tests"
          filename: "./apps/node-server/coverage/cobertura-coverage.xml"

      - name: Code Coverage Report - Base API Client Unit Tests
        if: contains(needs.changes.outputs.workspaces, 'libs/clients/base-api-client')
        uses: ./.github/actions/coverage-report
        with:
          package_name: "Base API Client - Unit Tests"
          filename: "./libs/clients/base-api-client/coverage/cobertura-coverage.xml"

      - name: Code Coverage Report - Base WebSocket Client Unit Tests
        if: contains(needs.changes.outputs.workspaces, 'libs/clients/base-websocket-client')
        uses: ./.github/actions/coverage-report
        with:
          package_name: "Base WebSocket Client - Unit Tests"
          filename: "./libs/clients/base-websocket-client/coverage/cobertura-coverage.xml"

      - name: Code Coverage Report - Base Long Poll Client Unit Tests
        if: contains(needs.changes.outputs.workspaces, 'libs/clients/base-long-poll-client')
        uses: ./.github/actions/coverage-report
        with:
          package_name: "Base Long Poll Client - Unit Tests"
          filename: "./libs/clients/base-long-poll-client/coverage/cobertura-coverage.xml"

  docker-build:
    needs: [changes, format, lint, build, test]
    if: needs.changes.outputs.has_images == 'true'
    # Only the affected images get a runner. The matrix itself lives in
    # .github/node-images.json so node-ci and node-cd cannot drift apart on
    # which images exist.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.image_matrix) }}
    name: docker-build (${{ matrix.image_name }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve image tags
        id: tags
        uses: ./.github/actions/resolve-container-tags
        with:
          version_file: ${{ matrix.version_file }}

      # cache_variant is deliberately unset: PR builds read the staging/main
      # caches but write nothing. See build-container for why.
      - name: Build Container
        uses: ./.github/actions/build-container
        with:
          image_name: ${{ matrix.image_name }}
          build_context: ${{ matrix.build_context }}
          dockerfile: ${{ matrix.dockerfile }}
          custom_tags: ${{ steps.tags.outputs.tags }}
          dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub_password: ${{ secrets.DOCKERHUB_PASSWORD }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # Deliberately NOT downstream of docker-build. This job builds its own `:test`
  # images with prepare-test-container and never consumed docker-build's output,
  # so the dependency only forced it to sit idle for ~3 minutes first.
  integration-test:
    needs: [changes, format, lint, build, test]
    if: needs.changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Prepare Scribear DB Container
        uses: ./.github/actions/prepare-test-container
        if: contains(needs.changes.outputs.workspaces, 'apps/session-manager') || contains(needs.changes.outputs.workspaces, 'apps/node-server')
        with:
          image_name: scribear/scribear-db
          build_context: ./infra/scribear-db
          dockerfile: infra/scribear-db/Dockerfile
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Session Manager Container
        uses: ./.github/actions/prepare-test-container
        if: contains(needs.changes.outputs.workspaces, 'apps/node-server')
        with:
          image_name: scribear/session-manager
          build_context: .
          dockerfile: apps/session-manager/Dockerfile
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Transcription Service CPU Container
        uses: ./.github/actions/prepare-test-container
        if: contains(needs.changes.outputs.workspaces, 'apps/node-server')
        with:
          image_name: scribear/transcription-service-cpu
          build_context: ./transcription_service
          dockerfile: ./transcription_service/Dockerfile_CPU
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Session Manager Integration Tests
        if: contains(needs.changes.outputs.workspaces, 'apps/session-manager')
        env:
          SCRIBEAR_DB_IMAGE: scribear/scribear-db:test
        run: npm run test:integration --workspace apps/session-manager

      - name: Code Coverage Report - Session Manager Integration Tests
        uses: ./.github/actions/coverage-report
        if: contains(needs.changes.outputs.workspaces, 'apps/session-manager')
        with:
          package_name: "Session Manager - Integration Tests"
          filename: "./apps/session-manager/coverage/cobertura-coverage.xml"

      - name: Run Node Server Integration Tests
        if: contains(needs.changes.outputs.workspaces, 'apps/node-server')
        env:
          SCRIBEAR_DB_IMAGE: scribear/scribear-db:test
          SCRIBEAR_SESSION_MANAGER_IMAGE: scribear/session-manager:test
          TRANSCRIPTION_SERVICE_IMAGE: scribear/transcription-service-cpu:test
        run: npm run test:integration --workspace apps/node-server

      - name: Code Coverage Report - Node Server Integration Tests
        uses: ./.github/actions/coverage-report
        if: contains(needs.changes.outputs.workspaces, 'apps/node-server')
        with:
          package_name: "Node Server - Integration Tests"
          filename: "./apps/node-server/coverage/cobertura-coverage.xml"

  # Also not downstream of docker-build, for the same reason: it builds the DB
  # image it needs itself.
  check-database-types:
    needs: [changes]
    if: contains(needs.changes.outputs.workspaces, 'infra/scribear-db')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node

      # Unconditional: this job only runs when infra/scribear-db is affected,
      # and every step below needs the image. It used to be gated on
      # apps/session-manager, which is a different condition entirely - it
      # happened to hold only because session-manager references scribear-db,
      # so the dependent expansion always pulled it in.
      - name: Prepare Scribear DB Container
        uses: ./.github/actions/prepare-test-container
        with:
          image_name: scribear/scribear-db
          build_context: ./infra/scribear-db
          dockerfile: infra/scribear-db/Dockerfile
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Start ScribeAR DB
        run: |
          docker run -d --name scribear-db \
            -e POSTGRES_DB=scribear-db-test \
            -e POSTGRES_USER=scribear \
            -e POSTGRES_PASSWORD=scribear \
            -p 5432:5432 \
            scribear/scribear-db:test

      - name: Wait for database to be ready
        run: |
          for i in $(seq 1 30); do
            if [ "$(docker inspect --format='{{.State.Health.Status}}' scribear-db)" = "healthy" ]; then
              exit 0
            fi
            sleep 1
          done
          echo "Database failed to start" && exit 1

      - name: Run build
        working-directory: ./infra/scribear-db
        run: npm run build

      - name: Run migrations
        working-directory: ./infra/scribear-db
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: scribear-db-test
          DB_USER: scribear
          DB_PASSWORD: scribear
        run: npm run migrate:up

      - name: Generate database types
        working-directory: "./infra/scribear-db"
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: scribear-db-test
          DB_USER: scribear
          DB_PASSWORD: scribear
        run: npm run generate:types

      - name: Check for uncommitted changes
        run: |
          git diff --exit-code infra/scribear-db/src/database.types.ts || \
          (echo "Error: Generated database types are out of date. Run 'npm run generate:types' in infra/scribear-db and commit the changes." && exit 1)

  node-ci:
    # `changes` is included so that a failure there fails the gate. Without it,
    # every other job is skipped and "all skipped" reads as a pass.
    needs: [changes, format, lint, build, test, docker-build, integration-test, check-database-types]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check All Jobs Pass
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          for result in $results; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "Job failed with result: $result"
              exit 1
            fi
          done
