<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="./favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="./favicon/favicon.svg" />
  <link rel="shortcut icon" href="./favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="./favicon/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="ScribeAR" />
  <!-- Lets iPadOS before 16.4 open this from the home screen without
       Safari chrome; newer iPadOS reads the manifest's "display"
       instead. A chrome-free window is a viewport that does not resize
       underneath the captions while someone is reading them. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <!-- Opaque black, matching the caption background, so the status bar
       blends in. Deliberately not "black-translucent": that pulls the
       page under the status bar and needs safe-area padding plumbed
       through the shared caption components to be safe. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="theme-color" content="#000000" />
  <link rel="manifest" href="./favicon/site.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScribeAR - Live Captions</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="./src/main.tsx"></script>
</body>

</html>
