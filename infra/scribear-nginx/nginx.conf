worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS. Every upstream below has a `resolve` server and a
    # `zone` - the combination nginx (OSS, since 1.27.3) needs to update a
    # peer's address at runtime instead of only when nginx itself starts or
    # reloads. Without it, `server name:80;` alone resolves once, so recreating
    # a backend container - a new address on the docker network - leaves nginx
    # holding the old one, which may by then have been reused by a different
    # container, until something restarts nginx too. `valid=5s` matches that
    # address's actual lifetime far better than "until nginx restarts";
    # `ipv6=off` because these networks hand out no AAAA records.
    #
    # This keeps every upstream a literal name in `proxy_pass`, not a variable:
    # a variable host defeats proxy_pass's own prefix-replacement (confirmed
    # against a real nginx - it silently collapses every request under a
    # trailing-slash location to a bare "/" instead of erroring) and loses
    # `keepalive`, which only exists inside a real `upstream {}` block. `zone`
    # + `resolve` gets dynamic resolution without giving up either.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    upstream client-webapp     { zone client-webapp     64k; server client-webapp:80     resolve; keepalive 16; }
    upstream standalone-webapp { zone standalone-webapp  64k; server standalone-webapp:80 resolve; keepalive 16; }
    upstream kiosk-webapp      { zone kiosk-webapp       64k; server kiosk-webapp:80      resolve; keepalive 16; }
    upstream admin-webapp      { zone admin-webapp       64k; server admin-webapp:80      resolve; keepalive 16; }
    upstream session-manager   { zone session-manager    64k; server session-manager:80   resolve; keepalive 16; }
    upstream admin-server      { zone admin-server       64k; server admin-server:80      resolve; keepalive 16; }
    # No keepalive: node-server's one location is a WebSocket upgrade, a
    # long-lived connection that was never a candidate for pooling anyway.
    upstream node-server       { zone node-server        64k; server node-server:80       resolve; }

    # Shared settings
    sendfile            on;
    keepalive_timeout   65;
    client_max_body_size 10m;

    # WebSocket upgrade map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name _;

        # This proxy's own build provenance, for the admin console's Deployment
        # Check. Generated at image build time by
        # tools/build-info/write-build-info.sh.
        #
        # On the plain-HTTP listener only, and deliberately so. Every other
        # container answers this question on a port that is not published to the
        # internet; nginx is the one that is, and repeating this block in the
        # 443 server would put the deployment's commit hash on the public web.
        # admin-server reaches it over the compose network as
        # http://nginx:80/build-info.json, which never leaves the host.
        #
        location = /build-info.json {
            access_log off;
            default_type application/json;
            root /usr/share/nginx/build-info;
        }

        # The redirect lives in `location /`, not at server level. A
        # server-level `return` runs in the rewrite phase, before nginx picks a
        # location at all, so it would short-circuit the exact match above and
        # 301 the build document too. Inside `location /` it is the fallback it
        # reads as: longest-prefix matching gives /build-info.json to the block
        # above and everything else to this one.
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/pub.cert;
        ssl_certificate_key /etc/nginx/ssl/priv.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Container healthcheck target. Self-contained (no upstream) so it
        # reports nginx's own liveness, and an exact match so it never shadows a
        # proxied route. The root "/" has no location and returns 404, which a
        # healthcheck would read as failure — hence a dedicated endpoint.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # -- Internal-only surfaces ------
        #
        # DO NOT DELETE THESE AS REDUNDANT. Each block below shadows a route
        # that the /api/... prefix blocks further down would otherwise forward,
        # and each of those routes is documented in its own schema as
        # cluster-internal. The prefix blocks are what makes them public: a
        # `location /api/node-server/` forwards *everything* under that prefix,
        # so a route becomes internet-reachable by being added to a service, with
        # nothing in this file mentioning it. These blocks are the only place the
        # documented boundary is actually enforced, so deleting one is a silent
        # regression - which is why each has a unit test that reads this file:
        # apps/node-server/tests/unit/nginx-status-not-public.test.ts and
        # apps/session-manager/tests/unit/nginx-session-config-stream-not-public.test.ts.
        #
        # Every real consumer of these routes reaches its service directly over
        # the `backend` compose network (monitoring-sidecar and admin-server use
        # NODE_SERVER_BASE_URL=http://node-server:80; node-server uses
        # SESSION_MANAGER_BASE_URL=http://session-manager:80), so none of them
        # traverse nginx and none of them are affected. Verified: nothing in the
        # repo fetches either path through an nginx origin.
        #
        # `return 404`, not `deny all`. A 403 confirms the route exists and only
        # withholds it, which is the one fact an unauthenticated prober wants;
        # 404 is indistinguishable from the route never having been built. Both
        # are deliberately *not* 401 - a 401 would invite key guessing against a
        # single shared static secret.
        #
        # Rejected alternatives:
        #   - Leaving them to their service API keys, as before. One shared
        #     static key with no rotation, no rate limit and no lockout is a
        #     thin last line for a telemetry surface carrying session and room
        #     uids; and the schema does not say "exposed but authenticated", it
        #     says it must not be exposed. Auth is still there, this is the
        #     layer that was missing.
        #   - `allow 172.16.0.0/12; deny all;` on the internal ranges. Pointless
        #     here: internal callers never come through nginx at all, so the
        #     allowlist would match nobody, and it would break the moment
        #     compose picked a different subnet.
        #   - Moving the routes off the `/api/...` prefixes (a separate port, or
        #     an /internal/ base path). That is the more robust fix, but it is a
        #     change to the schema contract every client library derives its
        #     URLs from, which is not this proxy's decision to make.
        #
        # Prefix matches (`^~`), not exact ones: they also cover a trailing
        # slash and any future sub-path (e.g. /status/sessions), which an exact
        # match would silently start publishing. `^~` beats any regex location,
        # and being longer than the /api/<service>/ prefixes below it wins over
        # those regardless of declaration order.

        # node-server's operational telemetry. Its schema
        # (libs/schemas/node-server-schema/src/status/routes/status.schema.ts)
        # says: "Intended for internal observability consumers (Monitoring
        # Sidecar, Admin Server) on the cluster-internal network; it must not be
        # exposed through the public reverse proxy." The response body carries
        # session uids, room uids and per-process counters.
        location ^~ /api/node-server/v1/status {
            return 404;
        }

        # session-manager's config long-poll for node-server. Documented as
        # service-to-service: SERVICE_API_KEY_AUTH_HEADER_SCHEMA is "used by
        # sibling services (Session Stream Server) to consume internal APIs",
        # and the route is guarded by the service key rather than the admin key
        # or a device token for exactly that reason. Not to be confused with
        # /api/session-manager/v1/database/schema, which is admin-key protected
        # and whose schema explicitly reasons about being on a public prefix -
        # that one is intended to be reachable and is left alone.
        location ^~ /api/session-manager/v1/schedule-management/session-config-stream/ {
            return 404;
        }

        # -- Backend APIs -------

        location /api/session-manager/ {
            proxy_pass http://session-manager;
            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/admin/ {
            proxy_pass http://admin-server;
            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Exact match wins over the /api/admin/ prefix block above regardless
        # of declaration order. SSE (B1.7 §2.5): unlike every other admin
        # route, this response is never complete, so it must not be buffered
        # or time out the way an ordinary request would - and, being long-lived,
        # it is not a keepalive-pooling candidate the way the block above is,
        # so it keeps managing its own Connection header instead of clearing it.
        location = /api/admin/v1/fleet/stream {
            proxy_pass http://admin-server;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 3600s;
        }

        location /api/node-server/ {
            proxy_pass http://node-server;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for session streaming
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }

        # -- Frontend Webapps --

        # The client webapp is served under /client/ (trailing slash). A bare
        # /client would otherwise 404, since there is no server-level root. The
        # browser preserves the URL fragment across this redirect, so a deep
        # link like /client#config=<...> still arrives as /client/#config=<...>
        # (used by the kiosk QR and the admin "open live captions" link).
        location = /client {
            return 308 /client/;
        }

        location /client/ {
            proxy_pass http://client-webapp/;
            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /kiosk/ {
            proxy_pass http://kiosk-webapp/;
            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /standalone/ {
            proxy_pass http://standalone-webapp/;
            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # The standalone microphone meter (libs/audio-meter-page/audio-meter.html,
        # copied into admin-webapp's bundle at build time) is a single
        # self-contained file whose DSP and UI are inline <script> blocks. Under
        # the /admin/ policy below, `script-src 'self'` blocks both: the page
        # renders, "Start metering" does nothing, and every readout stays an
        # em-dash — with nothing on screen saying why. Confirmed in a built
        # container with a real browser, which is the only way this shows up.
        #
        # So it gets its own policy rather than a relaxation of /admin/'s. This
        # one is tighter than the SPA's in every direction except inline script:
        # the page fetches nothing, talks to nothing (`connect-src 'none'`) and
        # only ever reaches the local microphone, so the two hashes below are
        # the complete set of code allowed to run on it. `blob:` is for the
        # AudioWorklet module the page assembles from its own DSP source; the
        # page falls back to a main-thread ScriptProcessorNode without it, which
        # works but is deprecated and does the DSP on the UI thread.
        #
        # Each hash is the sha256 of one <script> element's exact text. Editing
        # audio-meter.html changes them and silently kills the page again, so
        # apps/monitoring-sidecar/tests/unit/audio-meter-csp.test.ts recomputes
        # them from the shipped file and fails if they drift.
        #
        # Exact match, so it wins over the /admin/ prefix block regardless of
        # order; proxy_pass therefore has to name the upstream path in full,
        # since nginx replaces the whole matched URI with the one given here.
        location = /admin/audio-meter.html {
            proxy_pass http://admin-webapp/audio-meter.html;
            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header Content-Security-Policy "default-src 'none'; script-src 'sha256-cvuOF6nLjJ7dOwm1C5Dv/0uscuJEn9F12UxmpRXCMgc=' 'sha256-GP9R8iEpGPEEOCZjlpw9k9lackP5HwhBkdUm+wK1h0U=' blob:; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'" always;
            # Re-declare HSTS for the same reason the block below does.
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }

        location /admin/ {
            proxy_pass http://admin-webapp/;
            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'" always;
            # Re-declare HSTS: an add_header in a location replaces (not merges)
            # the server-level headers, so it must be repeated here.
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }
    }
}
