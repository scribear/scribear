worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS. Every upstream below has a `resolve` server and a
    # `zone` - the combination nginx (OSS, since 1.27.3) needs to update a
    # peer's address at runtime instead of only when nginx itself starts or
    # reloads. Without it, `server name:80;` alone resolves once, so recreating
    # a backend container - a new address on the docker network - leaves nginx
    # holding the old one, which may by then have been reused by a different
    # container, until something restarts nginx too. `valid=5s` matches that
    # address's actual lifetime far better than "until nginx restarts";
    # `ipv6=off` because these networks hand out no AAAA records.
    #
    # This keeps every upstream a literal name in `proxy_pass`, not a variable:
    # a variable host defeats proxy_pass's own prefix-replacement (confirmed
    # against a real nginx - it silently collapses every request under a
    # trailing-slash location to a bare "/" instead of erroring) and loses
    # `keepalive`, which only exists inside a real `upstream {}` block. `zone`
    # + `resolve` gets dynamic resolution without giving up either.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    upstream client-webapp     { zone client-webapp     64k; server client-webapp:80     resolve; keepalive 16; }
    upstream standalone-webapp { zone standalone-webapp  64k; server standalone-webapp:80 resolve; keepalive 16; }
    upstream kiosk-webapp      { zone kiosk-webapp       64k; server kiosk-webapp:80      resolve; keepalive 16; }
    upstream admin-webapp      { zone admin-webapp       64k; server admin-webapp:80      resolve; keepalive 16; }
    upstream session-manager   { zone session-manager    64k; server session-manager:80   resolve; keepalive 16; }
    upstream admin-server      { zone admin-server       64k; server admin-server:80      resolve; keepalive 16; }
    # Profile-gated: only exists when COMPOSE_PROFILES=monitoring. The `resolve`
    # parameter means nginx starts fine without it — the upstream is just down
    # and /grafana/ returns 502, which is the honest answer when monitoring is
    # off. `keepalive 16` because Grafana serves many small asset and API
    # requests per page load (JS bundles, CSS, panel queries, dashboard JSON) —
    # the strongest pooling candidate of any upstream in this file. Grafana
    # Live's WebSocket upgrades coexist with keepalive via the
    # `$grafana_connection` map below, which clears Connection for normal HTTP
    # (enabling pooling) and sets it to "upgrade" only for WS.
    upstream grafana           { zone grafana            64k; server grafana:3000         resolve; keepalive 16; }
    # No keepalive: node-server's one location is a WebSocket upgrade, a
    # long-lived connection that was never a candidate for pooling anyway.
    #
    # STICKY BY SESSION UID, AND IT HAS TO BE. node-server's orchestrator state
    # is per-process: the EventBus is in-process, and one session's upstream
    # transcription connection lives on whichever instance the *source*
    # connected to. A viewer that lands on a different instance subscribes to a
    # channel nothing publishes on and silently receives no transcripts - no
    # error, no banner, just an empty caption view. The orchestrator says so in
    # its own class doc: "Sticky URL routing pins all connections for a given
    # sessionUid to one Node Server instance."
    #
    # Round-robin (the default) satisfied that only by accident, because
    # `node-server` resolves to exactly one address today. Scaling the service
    # to two replicas is a one-word change in compose, and nothing about that
    # change would look like it could break captioning.
    #
    # NOT `hash ... consistent`, AND THAT IS MEASURED, NOT PREFERRED. Ketama
    # would be the better algorithm here - only ~1/N of sessions move when a
    # peer joins or leaves, which `resolve` makes a runtime event rather than a
    # restart - but `consistent` is silently ignored when the upstream's server
    # is a `resolve` name, and the upstream falls back to round-robin.
    #
    # Measured against nginx:1.29.7-alpine3.23 (this image's base), two
    # backends behind one docker network alias, requesting the same session uid
    # repeatedly:
    #
    #   hash $node_server_session_uid consistent;  ->  B A B A B A B A ...
    #   hash $node_server_session_uid;             ->  B B B B B B B B ...
    #
    # and, over 12s spanning several `valid=5s` re-resolutions, plain `hash`
    # held two different uids on two different peers throughout. `nginx -t`
    # passes on both, and with today's single replica both look identical -
    # this is exactly the kind of guard that would have been merged green and
    # done nothing.
    # `apps/node-server/tests/unit/nginx-node-server-sticky.test.ts` pins the
    # distinction so `consistent` cannot be "restored" as a tidy-up.
    #
    # The cost of plain modulo hashing is that changing the replica count
    # remaps most sessions. That is acceptable: it happens on a deploy, when
    # every connection is being re-established anyway, and both the source and
    # its viewers rehash to the same new peer.
    #
    # See `$node_server_session_uid` below for the key.
    upstream node-server {
        zone node-server 64k;
        hash $node_server_session_uid;
        server node-server:80 resolve;
    }

    # Shared settings
    sendfile            on;
    keepalive_timeout   65;
    client_max_body_size 10m;

    # WebSocket upgrade map. Used by node-server's location, where every
    # connection is a WebSocket upgrade and keepalive is explicitly not wanted
    # (see the comment on that upstream). The `close` value for non-upgrade
    # requests defeats keepalive — which is correct for node-server but wrong
    # for Grafana, so Grafana uses its own map below.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Grafana-specific connection map: same upgrade behavior for WebSocket
    # (Grafana Live's streaming datasource and real-time alert/presence
    # updates), but an EMPTY string for normal HTTP instead of `close`. An
    # empty Connection header is what enables upstream keepalive — `close`
    # would defeat the `keepalive 16` on the grafana upstream above. Grafana
    # serves many small HTTP requests per page (assets, panel queries,
    # dashboard JSON) that benefit from pooling, unlike node-server whose one
    # route is always a WebSocket.
    map $http_upgrade $grafana_connection {
        default upgrade;
        ''      '';
    }

    # Onsite-only access gate. Defines $onsite (1 = allowed, 0 = gated) from
    # $remote_addr against a `geo` block that lives outside this file - see
    # deployment/onsite-allowlist.example.conf for a real campus's ranges,
    # citations, and the reasoning behind what's included/excluded, and
    # 2026-08-02-PLAN-AccessRulesLandingPage.md (scribear2, not this repo) for the
    # full design.
    #
    # This include's target is deliberately NOT this file. A permissive
    # `default 1;` version is baked into the image at this exact path
    # (Dockerfile) so the image is self-sufficient and starts ungated even
    # under a compose file that has never heard of this feature; a real
    # deployment overrides it with a bind mount (deployment/compose.yml,
    # ONSITE_ALLOWLIST_PATH) pointed at a real allowlist. The bind mount always
    # wins when present - this include has no idea, and needs no idea, which
    # one is actually live. Deliberately unlike PROVIDER_CONFIG_PATH's default
    # (which requires copying a `.template` first, because there is no sane
    # universal provider set): "nobody is restricted" is a sane universal
    # default here, so the baked-in file is real and live, not a placeholder.
    include /etc/nginx/onsite/config/allowlist.conf;

    # $onsite is only as trustworthy as $remote_addr. If a load balancer, CDN,
    # or any other proxy sits in front of THIS nginx, $remote_addr becomes
    # that proxy's address, not the real client's - every request looks like
    # it came from the same place. The dangerous direction is silent
    # fail-open: if the front proxy's own address happens to fall inside the
    # allowlist (plausible if it runs on-campus), every off-campus request
    # would pass the gate regardless of where it actually originated.
    #
    # Leave this disabled (the default - nginx is the actual internet-facing
    # edge) unless there really is a trusted proxy in front of THIS
    # container specifically. Enabling it with no such proxy present would let
    # any client forge its own X-Forwarded-For and bypass the gate entirely -
    # the opposite failure, self-inflicted. `http_realip_module` is already
    # compiled into this image (`nginx -V` lists `--with-http_realip_module`),
    # so turning this on is uncommenting and filling in real values, not a
    # rebuild:
    #
    #   set_real_ip_from  <the front proxy's own IP or CIDR>;
    #   real_ip_header    X-Forwarded-For;  # or `proxy_protocol;` if it speaks that instead
    #   real_ip_recursive on;

    # Marks a response the onsite gate denied, for log/header visibility only
    # - $onsite itself (from the include above) is what actually drives the
    # allow/deny decision in each location below; this only makes a gate-403
    # distinguishable from an ordinary upstream 403 without inspecting
    # response bodies. Deliberately NOT set inside any `if ($onsite = 0)`
    # block - see the safe-`if` note further down - and deliberately empty
    # (not e.g. "allowed") on the passthrough case: nginx omits an
    # `add_header` entirely when its value is empty, so an allowed/proxied
    # response is untouched rather than gaining a header nobody asked for.
    map $onsite $onsite_gate_status {
        0       "denied";
        default "";
    }

    # Stops a stale 302 from being replayed by a caching intermediary after
    # the client actually connects to campus/VPN - a redirect has no
    # explicit cache directive otherwise, and some intermediary proxies
    # cache one heuristically. Same empty-value-omits-the-header technique
    # as $onsite_gate_status above, and for the same reason: several of the
    # locations this applies to also proxy long-cached, hash-versioned
    # static assets whose own upstream-set Cache-Control must not be touched
    # on the allowed path.
    map $onsite $onsite_no_cache {
        0       "no-store";
        default "";
    }

    # Balancing key for the node-server upstream: the session uid out of the
    # URL path. Both transcription-stream routes carry it in the same position -
    # /api/node-server/v1/transcription-stream/<sessionUid>/source and
    # .../client - which is exactly why it is in the path and not a query
    # parameter (see the route description in
    # libs/schemas/node-server-schema/.../transcription-stream.schema.ts: "The
    # session UID is carried in the URL so the L7 proxy can sticky-route every
    # connection for a session to the same Node Server instance").
    #
    # `$uri` rather than `$request_uri`: it is normalised and decoded and
    # carries no query string, so `%2e%2e` games and a trailing `?foo` cannot
    # change which peer a session hashes to.
    #
    # The fallback is `$remote_addr`, not the empty string. An empty key hashes
    # every non-stream request to one peer, quietly concentrating the readiness
    # probes and any future REST route on a single instance; `$remote_addr`
    # spreads them, and none of those routes is stateful so any peer will do.
    map $uri $node_server_session_uid {
        default                                                       $remote_addr;
        ~^/api/node-server/v1/transcription-stream/(?<sess_uid>[^/]+)  $sess_uid;
    }

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name _;

        # This proxy's own build provenance, for the admin console's Deployment
        # Check. Generated at image build time by
        # tools/build-info/write-build-info.sh.
        #
        # On the plain-HTTP listener only, and deliberately so. Every other
        # container answers this question on a port that is not published to the
        # internet; nginx is the one that is, and repeating this block in the
        # 443 server would put the deployment's commit hash on the public web.
        # admin-server reaches it over the compose network as
        # http://nginx:80/build-info.json, which never leaves the host.
        #
        location = /build-info.json {
            access_log off;
            default_type application/json;
            root /usr/share/nginx/build-info;
        }

        # The redirect lives in `location /`, not at server level. A
        # server-level `return` runs in the rewrite phase, before nginx picks a
        # location at all, so it would short-circuit the exact match above and
        # 301 the build document too. Inside `location /` it is the fallback it
        # reads as: longest-prefix matching gives /build-info.json to the block
        # above and everything else to this one.
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/pub.cert;
        ssl_certificate_key /etc/nginx/ssl/priv.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Every redirect this server generates itself - the /client and
        # /grafana trailing-slash 308s, the onsite gate's 302s to /extlanding,
        # and the site root below - is written as a path, and nginx would
        # otherwise expand each one into an absolute URL built from $host.
        # $host carries no port, so on any origin not served on 443 the
        # expansion silently rewrites which server the browser goes to next:
        # on the dev/iso stack (published at :8443) a gated /client/ answered
        # `Location: https://localhost/extlanding`, sending the browser to
        # port 443 - a different stack on the same machine. Observed against
        # real containers, not theorised.
        #
        # Emitting the path as written keeps the client on the origin it
        # already reached, whatever port that was. A relative Location has
        # been explicitly valid since RFC 7231 §7.1.2 (which replaced RFC
        # 2616's absolute-URI requirement); every browser has accepted one for
        # far longer.
        #
        # This does NOT affect the plain-HTTP listener's `return 301
        # https://$host$request_uri`, which is an absolute URL by construction
        # and so is left as nginx wrote it - and could not be fixed here
        # anyway: that redirect crosses schemes, and the TLS port is not
        # derivable from the HTTP one (the iso stack maps 8080->80 and
        # 8443->443, which no variable in this config relates).
        #
        # Nor does it touch Location headers that come back from an upstream:
        # those are proxy_redirect's business, and no location here sets one.
        #
        # `tests/unit/relative-redirects.test.ts` pins this: dropping the
        # directive breaks nothing in production, where everything is on 443,
        # and quietly misroutes every dev stack.
        absolute_redirect off;

        # Container healthcheck target. Self-contained (no upstream) so it
        # reports nginx's own liveness, and an exact match so it never shadows a
        # proxied route. "/" is not a substitute: it used to 404, and now 302s
        # to /client/ (see `location = /` below), which the Dockerfile's
        # busybox `wget -qO-` would follow into client-webapp — making this
        # container's health depend on a different container's, and on which
        # side of the onsite gate the healthcheck itself lands. Hence a
        # dedicated endpoint that answers for nginx and nothing else.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # -- Internal-only surfaces ------
        #
        # DO NOT DELETE THESE AS REDUNDANT. Each block below shadows a route
        # that the /api/... prefix blocks further down would otherwise forward,
        # and each of those routes is documented in its own schema as
        # cluster-internal. The prefix blocks are what makes them public: a
        # `location /api/node-server/` forwards *everything* under that prefix,
        # so a route becomes internet-reachable by being added to a service, with
        # nothing in this file mentioning it. These blocks are the only place the
        # documented boundary is actually enforced, so deleting one is a silent
        # regression - which is why each has a unit test that reads this file:
        # apps/node-server/tests/unit/nginx-status-not-public.test.ts and
        # apps/session-manager/tests/unit/nginx-session-config-stream-not-public.test.ts.
        #
        # Every real consumer of these routes reaches its service directly over
        # the `backend` compose network (monitoring-sidecar and admin-server use
        # NODE_SERVER_BASE_URL=http://node-server:80; node-server uses
        # SESSION_MANAGER_BASE_URL=http://session-manager:80), so none of them
        # traverse nginx and none of them are affected. Verified: nothing in the
        # repo fetches either path through an nginx origin.
        #
        # `return 404`, not `deny all`. A 403 confirms the route exists and only
        # withholds it, which is the one fact an unauthenticated prober wants;
        # 404 is indistinguishable from the route never having been built. Both
        # are deliberately *not* 401 - a 401 would invite key guessing against a
        # single shared static secret.
        #
        # Rejected alternatives:
        #   - Leaving them to their service API keys, as before. One shared
        #     static key with no rotation, no rate limit and no lockout is a
        #     thin last line for a telemetry surface carrying session and room
        #     uids; and the schema does not say "exposed but authenticated", it
        #     says it must not be exposed. Auth is still there, this is the
        #     layer that was missing.
        #   - `allow 172.16.0.0/12; deny all;` on the internal ranges. Pointless
        #     here: internal callers never come through nginx at all, so the
        #     allowlist would match nobody, and it would break the moment
        #     compose picked a different subnet.
        #   - Moving the routes off the `/api/...` prefixes (a separate port, or
        #     an /internal/ base path). That is the more robust fix, but it is a
        #     change to the schema contract every client library derives its
        #     URLs from, which is not this proxy's decision to make.
        #
        # Prefix matches (`^~`), not exact ones: they also cover a trailing
        # slash and any future sub-path (e.g. /status/sessions), which an exact
        # match would silently start publishing. `^~` beats any regex location,
        # and being longer than the /api/<service>/ prefixes below it wins over
        # those regardless of declaration order.

        # node-server's operational telemetry. Its schema
        # (libs/schemas/node-server-schema/src/status/routes/status.schema.ts)
        # says: "Intended for internal observability consumers (Monitoring
        # Sidecar, Admin Server) on the cluster-internal network; it must not be
        # exposed through the public reverse proxy." The response body carries
        # session uids, room uids and per-process counters.
        location ^~ /api/node-server/v1/status {
            return 404;
        }

        # session-manager's config long-poll for node-server. Documented as
        # service-to-service: SERVICE_API_KEY_AUTH_HEADER_SCHEMA is "used by
        # sibling services (Session Stream Server) to consume internal APIs",
        # and the route is guarded by the service key rather than the admin key
        # or a device token for exactly that reason. Not to be confused with
        # /api/session-manager/v1/database/schema, which is admin-key protected
        # and whose schema explicitly reasons about being on a public prefix -
        # that one is intended to be reachable and is left alone.
        location ^~ /api/session-manager/v1/schedule-management/session-config-stream/ {
            return 404;
        }

        # -- Onsite gate: devops preview -------
        #
        # Deliberately NOT behind the $onsite check below - its entire
        # purpose is letting someone on campus see exactly what an
        # off-campus visitor sees, without spoofing their source IP. Every
        # gated frontend route below redirects here; this is also directly
        # reachable on its own, from anywhere, on purpose. See
        # 2026-08-02-PLAN-AccessRulesLandingPage.md §3 (scribear2, not this repo).
        location = /extlanding {
            root /usr/share/nginx/onsite/content;
            try_files /index.html =404;
        }

        # -- Backend APIs -------
        #
        # Each `if ($onsite = 0) { return 403 ...; }` below is the one form
        # nginx's own docs call safe inside a location block - a bare
        # `return`, nothing else - see
        # https://www.nginx.com/resources/wiki/start/topics/depth/ifisevil/.
        # `403`, not `404`: unlike the internal-only routes above, an
        # off-campus caller SHOULD be told the route exists and exactly why
        # it's withheld - that's the whole point of this gate, not something
        # to obscure from a prober the way those routes are. Every location
        # also carries `add_header X-Onsite-Gate $onsite_gate_status
        # always;`, outside the `if` for the reason given where that map is
        # defined above - and, because THAT is this location's first
        # add_header, also re-declares Strict-Transport-Security: nginx only
        # inherits the server block's add_header directives when a location
        # defines none of its own, so adding any add_header here silently
        # drops HSTS otherwise (verified live - it disappeared from a real
        # response the first time this was written without the re-declare).
        # Same reasoning /admin/'s own re-declaration comment already gives.

        location /api/session-manager/ {
            if ($onsite = 0) {
                return 403 "Onsite only; captions are not served to the internet.\n";
            }
            add_header X-Onsite-Gate $onsite_gate_status always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            proxy_pass http://session-manager;
            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/admin/ {
            if ($onsite = 0) {
                return 403 "Onsite only; captions are not served to the internet.\n";
            }
            add_header X-Onsite-Gate $onsite_gate_status always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            proxy_pass http://admin-server;
            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Exact match wins over the /api/admin/ prefix block above regardless
        # of declaration order. SSE (B1.7 §2.5): unlike every other admin
        # route, this response is never complete, so it must not be buffered
        # or time out the way an ordinary request would - and, being long-lived,
        # it is not a keepalive-pooling candidate the way the block above is,
        # so it keeps managing its own Connection header instead of clearing it.
        location = /api/admin/v1/fleet/stream {
            if ($onsite = 0) {
                return 403 "Onsite only; captions are not served to the internet.\n";
            }
            add_header X-Onsite-Gate $onsite_gate_status always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            proxy_pass http://admin-server;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 3600s;
        }

        location /api/node-server/ {
            # The transcription-stream WebSocket - the literal captions
            # payload "captions are not served to the internet" refers to.
            if ($onsite = 0) {
                return 403 "Onsite only; captions are not served to the internet.\n";
            }
            add_header X-Onsite-Gate $onsite_gate_status always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            proxy_pass http://node-server;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for session streaming
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }

        # -- Frontend Webapps --

        # The site root. Onsite, "/" means the client webapp - that is what
        # someone typing the bare hostname into a lecture-room browser is
        # after, and until now they got a bare 404 with nothing to click.
        # Off-campus it behaves like every other frontend surface and shows
        # the landing page, so the gate's story is unchanged for anyone
        # outside the allowlist.
        #
        # 302 (temporary), not 301/308: what "/" resolves to depends on where
        # the visitor is, so it must stay re-resolvable. A permanent redirect
        # would be cached by the browser itself and replayed for the same
        # person on a different network, which is precisely the case this
        # location exists to distinguish.
        #
        # `Cache-Control: no-store` as a literal, NOT $onsite_no_cache: both
        # branches here are redirects chosen by the client's network location,
        # so neither may be stored - unlike the proxying locations below,
        # where the allowed path carries the upstream's own Cache-Control for
        # hash-versioned assets and must be left untouched (the reason that
        # map is empty on the allowed path - see where it is defined).
        #
        # Exact match, so it governs "/" and nothing else: there is still no
        # `location /`, so every other unrouted path 404s exactly as before.
        #
        # Both branches emit their Location as the bare path written here,
        # which is the server-level `absolute_redirect off` above doing its
        # job - it matters most for this location, the URL a person is most
        # likely to type by hand with a port on it.
        location = / {
            if ($onsite = 0) {
                return 302 /extlanding;
            }
            add_header X-Onsite-Gate $onsite_gate_status always;
            add_header Cache-Control "no-store" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            return 302 /client/;
        }

        # The client webapp is served under /client/ (trailing slash). A bare
        # /client would otherwise 404, since there is no server-level root. The
        # browser preserves the URL fragment across this redirect, so a deep
        # link like /client#config=<...> still arrives as /client/#config=<...>
        # (used by the kiosk QR and the admin "open live captions" link).
        location = /client {
            return 308 /client/;
        }

        # Frontend surfaces below redirect to /extlanding rather than
        # returning a bare 403 - a person, not an API client, is on the other
        # end, and the landing page explains why and how to get in (VPN /
        # campus network) rather than leaving a blank error. Each also sets
        # `Cache-Control: no-store` (via $onsite_no_cache, only on the
        # gate's own 302 - see where that map is defined) so a caching
        # intermediary can't replay a stale redirect after the client
        # actually connects. And, since these are each location's first
        # add_header, each also re-declares Strict-Transport-Security - see
        # the API section's comment above for why that's necessary here.

        location /client/ {
            if ($onsite = 0) {
                return 302 /extlanding;
            }
            add_header X-Onsite-Gate $onsite_gate_status always;
            add_header Cache-Control $onsite_no_cache always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            proxy_pass http://client-webapp/;
            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /kiosk/ {
            if ($onsite = 0) {
                return 302 /extlanding;
            }
            add_header X-Onsite-Gate $onsite_gate_status always;
            add_header Cache-Control $onsite_no_cache always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            proxy_pass http://kiosk-webapp/;
            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /standalone/ {
            if ($onsite = 0) {
                return 302 /extlanding;
            }
            add_header X-Onsite-Gate $onsite_gate_status always;
            add_header Cache-Control $onsite_no_cache always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            proxy_pass http://standalone-webapp/;
            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # The standalone microphone meter (libs/audio-meter-page/audio-meter.html,
        # copied into admin-webapp's bundle at build time) is a single
        # self-contained file whose DSP and UI are inline <script> blocks. Under
        # the /admin/ policy below, `script-src 'self'` blocks both: the page
        # renders, "Start metering" does nothing, and every readout stays an
        # em-dash — with nothing on screen saying why. Confirmed in a built
        # container with a real browser, which is the only way this shows up.
        #
        # So it gets its own policy rather than a relaxation of /admin/'s. This
        # one is tighter than the SPA's in every direction except inline script:
        # the page fetches nothing, talks to nothing (`connect-src 'none'`) and
        # only ever reaches the local microphone, so the two hashes below are
        # the complete set of code allowed to run on it. `blob:` is for the
        # AudioWorklet module the page assembles from its own DSP source; the
        # page falls back to a main-thread ScriptProcessorNode without it, which
        # works but is deprecated and does the DSP on the UI thread.
        #
        # Each hash is the sha256 of one <script> element's exact text. Editing
        # audio-meter.html changes them and silently kills the page again, so
        # apps/monitoring-sidecar/tests/unit/audio-meter-csp.test.ts recomputes
        # them from the shipped file and fails if they drift.
        #
        # Exact match, so it wins over the /admin/ prefix block regardless of
        # order; proxy_pass therefore has to name the upstream path in full,
        # since nginx replaces the whole matched URI with the one given here.
        location = /admin/audio-meter.html {
            if ($onsite = 0) {
                return 302 /extlanding;
            }
            add_header X-Onsite-Gate $onsite_gate_status always;
            add_header Cache-Control $onsite_no_cache always;
            proxy_pass http://admin-webapp/audio-meter.html;
            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header Content-Security-Policy "default-src 'none'; script-src 'sha256-cvuOF6nLjJ7dOwm1C5Dv/0uscuJEn9F12UxmpRXCMgc=' 'sha256-GP9R8iEpGPEEOCZjlpw9k9lackP5HwhBkdUm+wK1h0U=' blob:; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'" always;
            # Re-declare HSTS for the same reason the block below does.
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }

        location /admin/ {
            if ($onsite = 0) {
                return 302 /extlanding;
            }
            add_header X-Onsite-Gate $onsite_gate_status always;
            add_header Cache-Control $onsite_no_cache always;
            proxy_pass http://admin-webapp/;
            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'" always;
            # Re-declare HSTS: an add_header in a location replaces (not merges)
            # the server-level headers, so it must be repeated here.
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }

        # -- Grafana (monitoring profile) ------
        #
        # Proxied at /grafana/ (subpath mode) so it shares the same origin as
        # the admin console — one URL, one password gate, no SSH tunnel. See
        # 2026-08-02-03-RESEARCH-GrafanaDemo.md for the subpath-vs-dedicated-port
        # decision. The grafana service itself is profile-gated
        # (COMPOSE_PROFILES=monitoring); when the profile is off, the upstream
        # has no peers and this location returns 502 — the honest answer when
        # monitoring is not running.
        #
        # `proxy_pass http://grafana;` (no trailing path) passes the full
        # original URI unchanged, so /grafana/login reaches grafana:3000 as
        # /grafana/login. That is what subpath mode (GF_SERVER_ROOT_URL=.../
        # grafana/, GF_SERVER_SERVE_FROM_SUB_PATH=true) expects — a path-stripping
        # `proxy_pass http://grafana/;` would send /login instead, breaking
        # every redirect and asset path Grafana generates.
        #
        # WebSocket support is for Grafana Live (streaming datasources,
        # real-time alert/presence updates), NOT dashboard auto-refresh — a
        # Prometheus-backed dashboard refreshes by HTTP polling the query API.
        # The `$grafana_connection` map (not the `$connection_upgrade` map
        # node-server uses) clears Connection for normal HTTP, enabling the
        # `keepalive 16` on the upstream; only an actual WebSocket upgrade gets
        # `Connection: upgrade`. `proxy_read_timeout 3600s` keeps Live's
        # long-lived WebSocket from being silently dropped after nginx's 60s
        # default.
        #
        # `Host $http_host` (not `$host`): $host strips the port, which breaks
        # Grafana Live's WebSocket origin check on any non-standard port — the
        # browser's Origin header includes the port, and Grafana authorizes the
        # WS by comparing Origin's host against the forwarded Host. $http_host
        # preserves the port. The other locations in this file use $host
        # because their backends don't do origin-based WS authorization; Grafana
        # does.
        #
        # Gated the same way every frontend surface is: off-campus redirects to
        # /extlanding, on-campus passes through to Grafana's own auth (admin
        # password). The gate is additive — Grafana's password is still the
        # second factor.

        location = /grafana {
            return 308 /grafana/;
        }

        location /grafana/ {
            if ($onsite = 0) {
                return 302 /extlanding;
            }
            add_header X-Onsite-Gate $onsite_gate_status always;
            add_header Cache-Control $onsite_no_cache always;
            proxy_pass http://grafana;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $grafana_connection;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;

            # Re-declare HSTS: same reason every other gated location does.
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }
    }
}
